<style>
  :root{
    --ink:#0F2433;
    --muted:#567085;
    --paper:#FFFFFF;
    --mist:#F0F5F9;
    --line:#D8E3EB;
    --ocean:#0B4F7A;
    --sea:#1F7FB8;
    --sun:#F2B705;
    --night:#0E2A44;
    --radius-lg:22px;
    --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .tool{max-width:820px;margin:0 auto;padding:20px 16px 18px}
  button,select,input{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  .top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .top h1{font-family:var(--display);font-weight:700;font-size:clamp(1.65rem,4.6vw,2.35rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-variation-settings:"opsz" 96}
  .lead{margin:0;color:var(--muted);max-width:54ch}
  .seg{display:flex;background:var(--mist);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:0;background:none;padding:6px 10px;border-radius:999px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--paper);color:var(--ocean);box-shadow:0 1px 2px rgba(15,36,51,.12)}

  /* Controles */
  .controls{margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
  .field{position:relative}
  .field label{position:absolute;left:16px;top:8px;font-size:.75rem;color:var(--muted)}
  .spot select{appearance:none;-webkit-appearance:none;width:100%;height:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);padding:26px 44px 9px 16px;font-family:var(--display);font-weight:700;font-size:1.2rem;cursor:pointer}
  .spot::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--ocean);border-bottom:2.5px solid var(--ocean);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .weight{border:1.5px solid var(--line);border-radius:14px;padding:26px 16px 9px;min-width:230px}
  .weight .row{display:flex;align-items:center;gap:12px}
  .weight output{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
  .weight input[type=range]{flex:1;accent-color:var(--ocean);height:24px}
  .units{grid-column:1 / -1;display:flex;justify-content:flex-end;margin-top:-4px}

  .days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-top:12px}
  .days::-webkit-scrollbar{display:none}
  .days button{flex:0 0 auto;min-width:68px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 8px 8px;cursor:pointer;text-align:center;line-height:1.2}
  .days button span{display:block}
  .days .wd{font-size:.78rem;color:var(--muted)}
  .days .dn{font-family:var(--display);font-weight:700;font-size:1.1rem}
  .days .pk{margin-top:5px;border-radius:6px;font-size:.74rem;font-weight:700;padding:1px 0;font-variant-numeric:tabular-nums}
  .days button[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:#fff}
  .days button[aria-pressed="true"] .wd{color:#CFE4F2}

  /* Painel principal */
  .hero{margin-top:16px;background:var(--night);color:#fff;border-radius:var(--radius-lg);overflow:hidden}
  .hero-top{display:grid;grid-template-columns:1fr auto;gap:18px;padding:20px 22px 6px;align-items:center}
  .now-label{font-size:.88rem;color:#BFD6E6;margin:0 0 4px}
  .speed{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .speed b{font-family:var(--display);font-weight:700;font-size:clamp(3.4rem,13vw,5.2rem);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .speed span{font-size:1.1rem;color:#DCEAF4}
  .badge{display:inline-block;margin-top:10px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.9rem}
  .hero-meta{margin:8px 0 0;color:#DCEAF4;font-size:.95rem}
  .hero-meta strong{color:#fff}
  .kite{background:rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;min-width:170px;text-align:center}
  .kite .k-label{font-size:.82rem;color:#BFD6E6}
  .kite .k-size{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1.1}
  .kite .k-size.small{font-size:1.05rem;line-height:1.3;padding:6px 0}
  .kite .k-for{font-size:.82rem;color:#BFD6E6}
  .compass{display:block;margin:0 auto}
  .ribbon{padding:6px 10px 10px}
  .ribbon svg{display:block;width:100%}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 22px 16px;font-size:.78rem;color:#BFD6E6}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
  .msg{padding:12px 22px 18px;color:#DCEAF4}
  .retry{margin-left:6px;border:0;background:none;color:var(--sun);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

  .summary{margin:14px 2px 0;font-size:1.06rem;line-height:1.45;max-width:64ch}
  .summary strong{font-family:var(--display);font-weight:700}
  .warn{margin:6px 2px 0;color:#9A4A08;font-size:.94rem}

  .almanac{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid var(--ink)}
  .almanac section{padding:14px 18px 6px 0}
  .almanac section + section{padding-left:18px;border-left:1px solid var(--line)}
  .almanac h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 10px}
  .rows{list-style:none;margin:0;padding:0}
  .rows li{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .rows li:last-child{border-bottom:0}
  .rows .k{color:var(--muted);font-size:.9rem}
  .rows .v{font-family:var(--display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;text-align:right}
  .scale{list-style:none;margin:0;padding:0}
  .scale li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9rem}
  .scale li:last-child{border-bottom:0}
  .scale .chip{display:inline-block;min-width:86px;border-radius:6px;padding:1px 8px;font-weight:700;font-size:.82rem;text-align:center;font-variant-numeric:tabular-nums}
  .scale .d{color:var(--muted)}

  .about{margin-top:18px;background:var(--mist);border-radius:var(--radius-lg);padding:18px 20px}
  .about h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0}
  .about .city{color:var(--muted);font-size:.9rem;margin:0 0 8px}
  .about p.tip{margin:0;max-width:64ch}
  .about .season{margin:10px 0 0;font-size:.92rem;color:var(--muted)}
  .about a{display:inline-block;margin-top:10px;color:var(--ocean);font-weight:700}

  footer{margin-top:16px;color:var(--muted);font-size:.8rem;line-height:1.5}
  footer p{margin:0 0 4px}
  footer a{color:inherit}
  footer .brand{color:var(--ink);font-weight:700}

  @media (max-width:640px){
    .controls{grid-template-columns:1fr}
    .weight{min-width:0}
    .hero-top{grid-template-columns:1fr;padding:18px 18px 4px}
    .kite{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:12px}
    .legend{padding:0 18px 14px}
    .almanac{grid-template-columns:1fr}
    .almanac section + section{padding-left:0;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<main class="tool" id="app" aria-live="polite">
  <header class="top">
    <div>
      <h1 id="t-title"></h1>
      <p class="lead" id="t-lead"></p>
    </div>
    <div class="seg" role="group" id="langs"></div>
  </header>

  <div class="controls">
    <div class="field spot">
      <label for="spot" id="t-spot"></label>
      <select id="spot"></select>
    </div>
    <div class="field weight">
      <label for="kg" id="t-weight"></label>
      <div class="row">
        <input type="range" id="kg" min="40" max="120" step="5" value="75">
        <output id="kg-out" for="kg"></output>
      </div>
    </div>
    <div class="units"><div class="seg" role="group" id="units"></div></div>
  </div>

  <div class="days" id="days" role="group"></div>

  <section class="hero" id="hero"></section>
  <p class="summary" id="summary"></p>
  <p class="warn" id="warn"></p>

  <div class="almanac">
    <section><h2 id="t-day"></h2><ul class="rows" id="stats"></ul></section>
    <section><h2 id="t-scale"></h2><ul class="scale" id="scale"></ul></section>
  </div>

  <section class="about" id="about"></section>
  <footer id="foot"></footer>
</main>

/* ================= Tempo (Ceará: UTC−3) ================= */
var OFFSET = -3 * 3600e3, HOUR = 3600e3, DAY = 864e5;
function lp(t){ var d = new Date(t + OFFSET); return {y:d.getUTCFullYear(), m:d.getUTCMonth(), d:d.getUTCDate(), h:d.getUTCHours(), mi:d.getUTCMinutes()}; }
function dayStartOf(t){ var p = lp(t); return Date.UTC(p.y, p.m, p.d) - OFFSET; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function fmtTime(t){ var p = lp(Math.round(t / 60000) * 60000); return pad(p.h) + ":" + pad(p.mi); }

/* Nascer e pôr do sol (mesmo cálculo da ferramenta de maré) */
var rad = Math.PI / 180, J1970 = 2440588, J2000 = 2451545, OBL = rad * 23.4397, J0 = 0.0009;
function sunTimes(t, lat, lng){
  var lw = rad * -lng, phi = rad * lat, d = t / DAY - 0.5 + J1970 - J2000;
  var n = Math.round(d - J0 - lw / (2 * Math.PI)), ds = J0 + lw / (2 * Math.PI) + n;
  var M = rad * (357.5291 + 0.98560028 * ds);
  var L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  var dec = Math.asin(Math.sin(OBL) * Math.sin(L));
  var Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  var w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  var Jset = J2000 + J0 + (w + lw) / (2 * Math.PI) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  var fj = function(j){ return (j + 0.5 - J1970) * DAY; };
  return {sunrise: fj(Jnoon - (Jset - Jnoon)), sunset: fj(Jset)};
}

/* ================= Vento (Open-Meteo) ================= */
var cache = {}, lastError = "";
function windURL(s, simple){
  // simple = pedido mínimo, usado como plano B se o pedido completo for recusado
  var base = CONFIG.apiKey ? "https://customer-api.open-meteo.com/v1/forecast" : "https://api.open-meteo.com/v1/forecast";
  return base + "?latitude=" + s.lat + "&longitude=" + s.lon +
    "&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m" +
    (simple ? "" : "&current=wind_speed_10m,wind_gusts_10m,wind_direction_10m") +
    "&wind_speed_unit=kn&timezone=America%2FFortaleza&forecast_days=7" +
    (CONFIG.apiKey ? "&apikey=" + encodeURIComponent(CONFIG.apiKey) : "");
}
function getJSON(url){
  return fetch(url).then(function(r){
    return r.text().then(function(txt){
      var j = null; try { j = JSON.parse(txt); } catch(e){}
      if (!r.ok || !j || j.error) throw new Error("HTTP " + r.status + (j && j.reason ? ": " + j.reason : ""));
      return j;
    });
  });
}
function parseLocal(s, off){
  var dd = s.split("T")[0].split("-"), tt = (s.split("T")[1] || "00:00").split(":");
  return Date.UTC(+dd[0], +dd[1] - 1, +dd[2], +tt[0], +tt[1]) - off;
}
function loadWind(s){
  if (cache[s.id]) return cache[s.id];
  var pr = getJSON(windURL(s, false)).catch(function(err){
    lastError = err.message;
    return getJSON(windURL(s, true));
  }).then(function(j){
    var off = (j.utc_offset_seconds || 0) * 1000, h = j.hourly || {}, pts = [];
    if (!h.time || !h.wind_speed_10m) throw new Error("resposta sem dados de vento");
    h.time.forEach(function(ts, i){
      var v = h.wind_speed_10m[i], g = h.wind_gusts_10m ? h.wind_gusts_10m[i] : null, d = h.wind_direction_10m ? h.wind_direction_10m[i] : 0;
      if (v == null || !isFinite(v)) return;
      pts.push({t: parseLocal(ts, off), v: v, g: (g == null || !isFinite(g) ? v : g), d: (d == null || !isFinite(d) ? 0 : d)});
    });
    if (pts.length < 24) throw new Error("sem dados");
    var cur = null;
    if (j.current && j.current.wind_speed_10m != null){
      var c = j.current;
      cur = {t: c.time ? parseLocal(c.time, off) : Date.now(), v: c.wind_speed_10m, g: c.wind_gusts_10m == null ? c.wind_speed_10m : c.wind_gusts_10m, d: c.wind_direction_10m == null ? 0 : c.wind_direction_10m};
    }
    return {pts: pts, cur: cur};
  });
  cache[s.id] = pr;
  pr.catch(function(){ delete cache[s.id]; });
  return pr;
}

/* ================= Cálculos de kite ================= */
function shoreType(spot, dir){
  if (spot.lagoon) return "lagoon";
  var diff = Math.abs(((dir - spot.sea) % 360 + 540) % 360 - 180);
  // diff: 0 = vento vindo do mar, 180 = vento vindo da terra
  if (diff < 35) return "on";
  if (diff <= 115) return "side";
  if (diff <= 150) return "sideoff";
  return "off";
}
var SIZES = [5, 6, 7, 8, 9, 10, 11, 12, 14, 15, 17];
function kiteSize(kn, kg){
  if (kn < 12) return {none:true};
  if (kn > 32) return {max:true};
  var raw = kg * 2.2 / kn;
  var best = SIZES[0];
  SIZES.forEach(function(s){ if (Math.abs(s - raw) < Math.abs(best - raw)) best = s; });
  return {size: best};
}
function meanDir(list){
  var x = 0, y = 0;
  list.forEach(function(p){ x += p.v * Math.sin(p.d * rad); y += p.v * Math.cos(p.d * rad); });
  return (Math.atan2(x, y) / rad + 360) % 360;
}

/* ================= Estado ================= */
var params = new URLSearchParams(location.search);
var DEBUG = params.has("debug");
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
var state = {
  lang: detectLang(),
  spot: SPOTS.filter(function(s){ return s.id === params.get("pico"); })[0] || SPOTS[6],
  day: 0,
  kg: +(store("hnc-kg") || 75) || 75,
  unit: store("hnc-unit") === "kmh" ? "kmh" : "kn",
  data: null, status: "loading"
};
function detectLang(){
  var q = (params.get("lang") || "").toLowerCase();
  if (LANGS.indexOf(q) >= 0) return q;
  var host = "", path = "";
  try { if (location.ancestorOrigins && location.ancestorOrigins.length) host = new URL(location.ancestorOrigins[0]).hostname; } catch(e){}
  try { if (document.referrer){ var u = new URL(document.referrer); host = host || u.hostname; path = u.pathname; } } catch(e){}
  var m = host.match(/^(en|es|fr|it)\./) || path.match(/^\/(en|es|fr|it)(\/|$)/);
  if (m) return m[1];
  if (/hojenoceara\.com\.br$/.test(host)) return "pt";
  var nav = (navigator.language || "pt").slice(0, 2).toLowerCase();
  return LANGS.indexOf(nav) >= 0 ? nav : "pt";
}
function tr(){ return T[state.lang]; }
function fill(s, o){ return s.replace(/\{(\w+)\}/g, function(_, k){ return o[k] != null ? o[k] : ""; }); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function cv(kn){ return Math.round(state.unit === "kmh" ? kn * 1.852 : kn); }
function unitLabel(){ return tr()[state.unit]; }
function compass(d){ return tr().compass[Math.round(((d % 360) + 360) % 360 / 22.5) % 16]; }
function bandRange(i){
  var lo = i === 0 ? 0 : BANDS[i-1].max, hi = BANDS[i].max;
  if (i === 0) return "< " + cv(hi);
  if (hi > 100) return cv(lo) + "+";
  return cv(lo) + "–" + cv(hi);
}

var $ = function(id){ return document.getElementById(id); };
var today0 = dayStartOf(Date.now());

/* Dados de um dia: horas de luz, janela boa etc. */
function dayInfo(i){
  var s = state.spot, ds = today0 + i * DAY;
  var sun = sunTimes(ds + 12 * HOUR, s.lat, s.lon);
  if (!state.data) return {ds: ds, sun: sun};
  var all = state.data.pts.filter(function(p){ return p.t >= ds && p.t < ds + DAY; });
  var light = all.filter(function(p){ return p.t >= sun.sunrise - 30 * 60e3 && p.t <= sun.sunset; });
  if (!light.length) return {ds: ds, sun: sun, all: all, light: []};
  var avg = light.reduce(function(a, p){ return a + p.v; }, 0) / light.length;
  var peak = light.reduce(function(a, p){ return p.v > a.v ? p : a; });
  var maxG = light.reduce(function(a, p){ return Math.max(a, p.g); }, 0);
  var gustD = light.reduce(function(a, p){ return Math.max(a, p.g - p.v); }, 0);
  var off = light.some(function(p){ return shoreType(s, p.d) === "off" && p.v >= 10; });
  // janela: maior sequência de horas com vento entre 15 e 32 nós e sem terral
  function window_(min){
    var best = null, cur = null;
    light.forEach(function(p){
      var ok = p.v >= min && p.v <= 30 && shoreType(s, p.d) !== "off";
      if (ok){ cur = cur || []; cur.push(p); if (!best || cur.length > best.length) best = cur.slice(); }
      else cur = null;
    });
    return best && best.length >= 2 ? best : null;
  }
  var win = window_(15);
  return {ds: ds, sun: sun, all: all, light: light, avg: avg, peak: peak, maxG: maxG, gustD: gustD, off: off, win: win, dir: meanDir(light)};
}

  }).join("");
}

function renderDays(){
  var t = tr(), wdf = new Intl.DateTimeFormat(LOCALE[state.lang], {weekday:"short", timeZone:"UTC"}), html = "";
  for (var i = 0; i < 7; i++){
    var di = dayInfo(i), dt = new Date(di.ds + OFFSET);
    var wd = i === 0 ? t.today : i === 1 ? t.tomorrow : wdf.format(dt).replace(".", "");
    wd = wd.charAt(0).toUpperCase() + wd.slice(1);
    var pk = "";
    if (di.peak){ var b = BANDS[band(di.peak.v)]; pk = '<span class="pk" style="background:' + b.bg + ';color:' + b.fg + '">' + cv(di.peak.v) + '</span>'; }
    html += '<button type="button" data-day="' + i + '" aria-pressed="' + (i === state.day) + '"><span class="wd">' + esc(wd) + '</span><span class="dn">' + dt.getUTCDate() + '</span>' + pk + '</button>';
  }
  $("days").innerHTML = html;
}

function arrowSVG(dir, size, color){
  // seta apontando para onde o vento vai
  return '<svg width="' + size + '" height="' + size + '" viewBox="-12 -12 24 24" aria-hidden="true"><g transform="rotate(' + ((dir + 180) % 360).toFixed(0) + ')"><path d="M0,-10 L6,4 L0,1 L-6,4 Z" fill="' + color + '"/></g></svg>';
}

function render(){
  try { renderUnsafe(); }
  catch(e){
    if (window.console) console.error("[vento-kitesurf] erro ao desenhar:", e);
    $("hero").innerHTML = '<div class="msg">' + esc(tr().error) + (DEBUG ? '<br><small>' + esc(e.message) + '</small>' : '') + '</div>';
    postHeight();
  }
}
function renderUnsafe(){
  var t = tr(), s = state.spot, di = dayInfo(state.day);
  renderDays();

  if (state.status !== "ok"){
    var body = state.status === "loading" ? esc(t.loading)
      : esc(t.error) + ' <button type="button" class="retry" id="retry">' + esc(t.retry) + '</button>' + (DEBUG && lastError ? '<br><small>' + esc(lastError) + '</small>' : '');
    $("hero").innerHTML = '<div class="msg">' + body + '</div>';
    $("summary").innerHTML = ""; $("warn").textContent = "";
    $("stats").innerHTML = "";
    var rb = $("retry"); if (rb) rb.onclick = fetchWind;
    renderAbout(); postHeight(); return;
  }

  // Destaque: agora (hoje) ou pico do dia
  var focus, label;
  if (state.day === 0 && !state.data.cur){
    // sem leitura "agora": usa a hora mais próxima da previsão
    var nowT = Date.now();
    var near = state.data.pts.reduce(function(a, p){ return Math.abs(p.t - nowT) < Math.abs(a.t - nowT) ? p : a; });
    if (Math.abs(near.t - nowT) < 90 * 60e3) state.data.cur = near;
  }
  if (state.day === 0 && state.data.cur){ focus = state.data.cur; label = t.now; }
  else if (di.peak){ focus = di.peak; label = fill(t.peak, {time: fmtTime(di.peak.t)}); }
  if (!focus){ focus = di.all[12] || state.data.pts[0]; label = ""; }

  var bi = band(focus.v), B = BANDS[bi], ks = kiteSize(di.win ? (di.win.reduce(function(a, p){ return a + p.v; }, 0) / di.win.length) : focus.v, state.kg);
  if (state.day === 0 && state.data.cur) ks = kiteSize(focus.v, state.kg);
  var kiteHTML = ks.none ? '<div class="k-size small">' + esc(t.kiteNone) + '</div>'
    : ks.max ? '<div class="k-size small">' + esc(t.kiteMax) + '</div>'
    : '<div class="k-size">' + ks.size + ' m²</div>';
  var sh = shoreType(s, focus.d);

  $("hero").innerHTML =
    '<div class="hero-top"><div>' +
      '<p class="now-label">' + esc(label) + '</p>' +
      '<div class="speed"><b>' + cv(focus.v) + '</b><span>' + esc(unitLabel()) + '</span>' + arrowSVG(focus.d, 34, "#F2B705") + '</div>' +
      '<span class="badge" style="background:' + B.bg + ';color:' + B.fg + '">' + esc(t.classes[bi]) + '</span>' +
      '<p class="hero-meta">' + esc(fill(t.gusts, {v: cv(focus.g) + " " + unitLabel()})) + ', ' + esc(fill(t.from, {dir: compass(focus.d)})) + ' (' + Math.round(focus.d) + '°)<br><strong>' + esc(t.shore[sh]) + '</strong></p>' +
    '</div>' +
    '<div class="kite"><div><div class="k-label">' + esc(t.kite) + '</div><div class="k-for">' + esc(fill(t.kiteFor, {kg: state.kg})) + '</div></div>' + kiteHTML + '</div></div>' +
    '<div class="ribbon" id="ribbon"></div>' +
    '<div class="legend">' + BANDS.map(function(b, i){ return '<span><i style="background:' + b.bg + '"></i>' + esc(t.classes[i]) + '</span>'; }).join("") + '</div>';
  drawRibbon(di);

  // Frase do dia
  var sum = "";
  if (di.win){
    var wAvg = di.win.reduce(function(a, p){ return a + p.v; }, 0) / di.win.length;
    sum = fill(t.sumGood, {from: fmtTime(di.win[0].t), to: fmtTime(di.win[di.win.length - 1].t + HOUR), cls: t.classes[band(Math.round(wAvg))].toLowerCase(), avg: cv(wAvg), unit: unitLabel(), dir: compass(meanDir(di.win))});
  } else if (di.avg != null && di.avg > 30){
    sum = fill(t.sumStrong, {avg: cv(di.avg), unit: unitLabel()});
  } else if (di.peak){
    sum = fill(t.sumLight, {time: fmtTime(di.peak.t), v: cv(di.peak.v), unit: unitLabel()});
  }
  $("summary").innerHTML = sum;
  var warns = [];
  if (di.off) warns.push(t.offWarn);
  if (di.gustD >= 10) warns.push(fill(t.gusty, {d: cv(di.gustD), unit: unitLabel()}));
  $("warn").textContent = warns.join(" ");

  // Resumo
  $("stats").innerHTML = di.light && di.light.length ?
    '<li><span class="k">' + esc(t.best) + '</span><span class="v">' + (di.win ? fmtTime(di.win[0].t) + "–" + fmtTime(di.win[di.win.length - 1].t + HOUR) : esc(t.none)) + '</span></li>' +
    '<li><span class="k">' + esc(t.avg) + '</span><span class="v">' + cv(di.avg) + ' ' + esc(unitLabel()) + '</span></li>' +
    '<li><span class="k">' + esc(t.maxGust) + '</span><span class="v">' + cv(di.maxG) + ' ' + esc(unitLabel()) + '</span></li>' +
    '<li><span class="k">' + esc(t.dir) + '</span><span class="v">' + compass(di.dir) + '</span></li>' +
    '<li><span class="k">' + esc(t.shoreRow) + '</span><span class="v" style="font-size:.95rem">' + esc(t.shore[shoreType(s, di.dir)]) + '</span></li>'
    : '';

  renderAbout();
  postHeight();
}

function renderAbout(){
  var t = tr(), s = state.spot, link = CONFIG.guides[s.id];
  if (link && state.lang !== "pt"){ try { var u = new URL(link); u.hostname = state.lang + ".hojenoceara.com.br"; link = u.toString(); } catch(e){} }
  $("about").innerHTML = '<h2>' + esc(s.name) + '</h2><p class="city">' + esc(s.city) + ', Ceará</p><p class="tip">' + esc(t.tips[s.id]) + '</p>' +
    '<p class="season">' + esc(t.season) + '</p>' + (link ? '<a href="' + esc(link) + '" target="_top">' + esc(t.guide) + '</a>' : '');
}

/* ================= Faixa hora a hora ================= */
function drawRibbon(di){
  var box = $("ribbon"); if (!box) return;
  var W = Math.max(280, Math.round(box.clientWidth || 700));
  var narrow = W < 520;
  var h0 = 5, h1 = 19, n = h1 - h0; // 05:00 até 18:00
  var colW = W / n, H = narrow ? 210 : 240;
  var topPad = 24, barBase = H - 58, maxBar = barBase - topPad;
  var hours = [];
  for (var k = 0; k < n; k++){
    var t0 = di.ds + (h0 + k) * HOUR;
    var p = (di.all || []).filter(function(q){ return Math.abs(q.t - t0) < 30 * 60e3; })[0];
    hours.push({t: t0, p: p});
  }
  var scaleMax = Math.max(30, hours.reduce(function(a, o){ return o.p ? Math.max(a, o.p.g) : a; }, 0) + 2);
  var svg = "";
  // faixa de noite/dia
  var sr = (di.sun.sunrise - di.ds) / HOUR - h0, ss = (di.sun.sunset - di.ds) / HOUR - h0;
  svg += '<rect x="0" y="0" width="' + Math.max(0, sr * colW).toFixed(1) + '" height="' + barBase + '" fill="#000" opacity=".22"/>' +
         '<rect x="' + (ss * colW).toFixed(1) + '" y="0" width="' + Math.max(0, W - ss * colW).toFixed(1) + '" height="' + barBase + '" fill="#000" opacity=".22"/>';
  // linhas de referência 15 e 25 nós
  [15, 25].forEach(function(ref){
    var yy = barBase - ref / scaleMax * maxBar;
    svg += '<line x1="0" x2="' + W + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="#fff" stroke-opacity=".14" stroke-dasharray="3 5"/>';
    if (!narrow) svg += '<text x="' + (W - 2) + '" y="' + (yy - 4).toFixed(1) + '" text-anchor="end" font-family="Atkinson Hyperlegible, sans-serif" font-size="10" fill="#8FB0C8">' + cv(ref) + '</text>';
  });
  var nowT = state.day === 0 ? Date.now() : null;
  hours.forEach(function(o, k){
    var cx = k * colW + colW / 2, bw = Math.min(colW * 0.62, 30);
    if (o.p){
      var B = BANDS[band(o.p.v)];
      var hv = o.p.v / scaleMax * maxBar, hg = o.p.g / scaleMax * maxBar;
      var isNow = nowT && nowT >= o.t && nowT < o.t + HOUR;
      svg += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (barBase - hg).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (hg - hv + 4).toFixed(1) + '" rx="' + Math.min(6, bw / 3).toFixed(1) + '" fill="' + B.bg + '" fill-opacity=".12" stroke="' + B.bg + '" stroke-opacity=".75" stroke-width="1.5" stroke-dasharray="3 2"/>' +
             '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (barBase - hv).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hv.toFixed(1) + '" rx="' + Math.min(6, bw / 3).toFixed(1) + '" fill="' + B.bg + '"' + (isNow ? ' stroke="#fff" stroke-width="2"' : '') + '/>' +
             '<text x="' + cx.toFixed(1) + '" y="' + (barBase - hg - 6).toFixed(1) + '" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="700" font-size="' + (narrow ? 12 : 14) + '" fill="#fff">' + cv(o.p.v) + '</text>' +
             '<g transform="translate(' + cx.toFixed(1) + ',' + (barBase + 17) + ') rotate(' + ((o.p.d + 180) % 360).toFixed(0) + ')"><path d="M0,-8 L5,4 L0,1.5 L-5,4 Z" fill="#DCEAF4"/></g>';
    }
    var showLabel = !narrow || k % 2 === 0;
    if (showLabel){
      svg += '<text x="' + cx.toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="11.5" fill="#BFD6E6">' + pad(h0 + k) + 'h</text>';
    }
  });
  var dateTxt = new Intl.DateTimeFormat(LOCALE[state.lang], {day:"numeric", month:"long", timeZone:"UTC"}).format(new Date(di.ds + OFFSET));
  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(fill(tr().ribbonLabel, {spot: state.spot.name, date: dateTxt})) + '">' + svg + '</svg>';
}

/* ================= Eventos ================= */
function fetchWind(){
  var s = state.spot;
  state.data = null; state.status = "loading"; render();
  loadWind(s).then(function(d){
    if (state.spot !== s) return;
    state.data = d; state.status = "ok"; render();
  }, function(err){
    if (state.spot !== s) return;
    lastError = err && err.message || String(err);
    if (window.console) console.error("[vento-kitesurf] falha ao carregar:", lastError);
    state.status = "error"; render();
  });
}
$("langs").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  state.lang = b.getAttribute("data-lang"); renderStatic(); render();
});
$("units").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  state.unit = b.getAttribute("data-unit"); store("hnc-unit", state.unit); renderStatic(); render();
});
$("days").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  state.day = +b.getAttribute("data-day"); render();
});
$("spot").addEventListener("change", function(e){
  state.spot = SPOTS.filter(function(s){ return s.id === e.target.value; })[0]; fetchWind();
});
$("kg").addEventListener("input", function(e){
  state.kg = +e.target.value; $("kg-out").textContent = state.kg + " kg"; store("hnc-kg", state.kg); render();
});

var lastH = 0;
function postHeight(){
  var h = Math.ceil(document.documentElement.scrollHeight);
  if (h !== lastH && window.parent !== window){ lastH = h; window.parent.postMessage({hncTool:"vento-kitesurf", height:h}, "*"); }
}
var lastW = 0;
if (window.ResizeObserver){
  new ResizeObserver(function(){
    var w = document.body.clientWidth;
    if (w !== lastW){ lastW = w; render(); } else postHeight();
  }).observe(document.body);
}
document.fonts && document.fonts.ready.then(render);
setInterval(function(){ if (state.day === 0) render(); }, 5 * 60e3);

renderStatic();
fetchWind();
})();
</script>
