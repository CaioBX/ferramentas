<style>
  :root{
    --ink:#0F2433;
    --muted:#567085;
    --paper:#FFFFFF;
    --mist:#F0F5F9;
    --line:#D8E3EB;
    --ocean:#0B4F7A;
    --sea:#1F7FB8;
    --sun:#F2B705;
    --radius-lg:22px;
    --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .tool{max-width:820px;margin:0 auto;padding:20px 16px 18px}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  .top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .top h1{font-family:var(--display);font-weight:700;font-size:clamp(1.65rem,4.6vw,2.35rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-variation-settings:"opsz" 96}
  .lead{margin:0;color:var(--muted);max-width:54ch}
  .tops{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .seg{display:flex;background:var(--mist);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:0;background:none;padding:6px 10px;border-radius:999px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--paper);color:var(--ocean);box-shadow:0 1px 2px rgba(15,36,51,.12)}

  .goals{margin-top:18px}
  .group-label{font-size:.82rem;color:var(--muted);margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:.92rem;cursor:pointer;line-height:1.25}
  .chips button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--ink);font-weight:700}
  .goal-note{margin:8px 2px 0;font-size:.95rem;min-height:1.5em}
  .goal-note strong{font-family:var(--display)}

  /* Faixa do ano */
  .year{margin-top:14px;border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:10px 8px 4px}
  .year svg{display:block;width:100%}
  .year .col{cursor:pointer}
  .legend{display:flex;gap:16px;flex-wrap:wrap;padding:2px 10px 6px;font-size:.8rem;color:var(--muted)}
  .legend i{display:inline-block;vertical-align:-1px;margin-right:5px}
  .legend .bar{width:10px;height:12px;border-radius:3px;background:var(--sea)}
  .legend .dot{width:11px;height:11px;border-radius:50%;background:var(--sun)}
  .legend .band{width:16px;height:5px;border-radius:3px;background:var(--sun);vertical-align:2px}

  /* Mês escolhido */
  .month{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px;align-items:start}
  .m-head h2{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,8vw,3.4rem);line-height:.95;letter-spacing:-.03em;margin:0;text-transform:none}
  .verdict{display:inline-block;margin-top:12px;border-radius:999px;padding:4px 14px;font-weight:700;font-size:.95rem}
  .tip{margin:14px 0 0;font-size:1.06rem;line-height:1.5;max-width:46ch}
  .stats{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
  .stats li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
  .stats .k{color:var(--muted);font-size:.92rem}
  .stats .v{font-family:var(--display);font-weight:700;font-size:1.15rem;text-align:right;font-variant-numeric:tabular-nums}
  .stats .v small{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
  .meter{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
  .meter i{width:7px;height:12px;border-radius:2px;background:var(--line)}
  .meter i.on{background:var(--ocean)}

  .about{margin-top:20px;background:var(--mist);border-radius:var(--radius-lg);padding:16px 20px;font-size:.95rem}
  .about p{margin:0;max-width:66ch}
  footer{margin-top:16px;color:var(--muted);font-size:.8rem;line-height:1.5}
  footer p{margin:0 0 4px}
  footer a{color:inherit}
  footer .brand{color:var(--ink);font-weight:700}

  @media (max-width:640px){
    .month{grid-template-columns:1fr;gap:14px}
    .tops{align-items:flex-start}
  }
</style>
</head>
<body>
<main class="tool" aria-live="polite">
  <header class="top">
    <div>
      <h1 id="t-title"></h1>

  <div class="year">
    <div id="strip"></div>
    <div class="legend" id="legend"></div>
  </div>

  <section class="month" id="month"></section>
  <section class="about"><p id="about"></p></section>
  <footer id="foot"></footer>
</main>

    "Uno dei mesi più secchi e soleggiati dell'anno, con vento forte. Buon equilibrio tra clima e affollamento.",
    "Sole, vento e poca gente prima dell'estate. Alla fine della stagione secca le lagune sono più basse.",
    "L'alta stagione inizia con Capodanno: spiagge piene e prezzi più alti. Prenota presto."
  ]
}
};

/* ================= Estado ================= */
var params = new URLSearchParams(location.search);
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
var qm = parseInt(params.get("mes"), 10);
var state = {
  lang: detectLang(),
  month: qm >= 1 && qm <= 12 ? qm - 1 : new Date(Date.now() - 3 * 3600e3).getUTCMonth(),
  goal: GOALS[params.get("prioridade")] ? params.get("prioridade") : null,
  unit: store("hnc-temp") === "F" ? "F" : "C"
};
function detectLang(){
  var q = (params.get("lang") || "").toLowerCase();
  if (LANGS.indexOf(q) >= 0) return q;
  var host = "", path = "";
  try { if (location.ancestorOrigins && location.ancestorOrigins.length) host = new URL(location.ancestorOrigins[0]).hostname; } catch(e){}
  try { if (document.referrer){ var u = new URL(document.referrer); host = host || u.hostname; path = u.pathname; } } catch(e){}
  var m = host.match(/^(en|es|fr|it)\./) || path.match(/^\/(en|es|fr|it)(\/|$)/);
  if (m) return m[1];
  if (/hojenoceara\.com\.br$/.test(host)) return "pt";
  var nav = (navigator.language || "pt").slice(0, 2).toLowerCase();
  return LANGS.indexOf(nav) >= 0 ? nav : "pt";
}
function tr(){ return T[state.lang]; }
function fill(s, o){ return s.replace(/\{(\w+)\}/g, function(_, k){ return o[k] != null ? o[k] : ""; }); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function num(v, d){ return new Intl.NumberFormat(LOCALE[state.lang], {minimumFractionDigits:d || 0, maximumFractionDigits:d || 0}).format(v); }
function temp(c){ return state.unit === "F" ? Math.round(c * 9 / 5 + 32) + "°F" : Math.round(c) + "°C"; }
function monthName(i, style){
  var s = new Intl.DateTimeFormat(LOCALE[state.lang], {month: style || "long", timeZone:"UTC"}).format(new Date(Date.UTC(2026, i, 15)));
  s = s.replace(".", "");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function verdict(i){ var r = DATA[i].rain; return r < 40 ? 0 : r <= 160 ? 1 : 2; }
var VERDICT_STYLE = [{bg:"#F2B705", fg:"#0F2433"}, {bg:"#BFE3E4", fg:"#0F2433"}, {bg:"#1F7FB8", fg:"#FFFFFF"}];
var $ = function(id){ return document.getElementById(id); };

/* ================= Interface ================= */
function renderStatic(){
  var t = tr();
  document.documentElement.lang = LOCALE[state.lang];
  document.title = t.title;
  $("t-title").textContent = t.title;
  $("t-lead").textContent = t.lead;
  $("t-goal").textContent = t.goal;
  $("langs").setAttribute("aria-label", t.langGroup);
  $("units").setAttribute("aria-label", t.unitGroup);
  $("goals").setAttribute("aria-label", t.goal);
  $("langs").innerHTML = LANGS.map(function(l){
    return '<button type="button" data-lang="' + l + '" aria-pressed="' + (l === state.lang) + '" lang="' + LOCALE[l] + '">' + l.toUpperCase() + '</button>';
  }).join("");
  $("units").innerHTML = ["C","F"].map(function(u){
    return '<button type="button" data-unit="' + u + '" aria-pressed="' + (u === state.unit) + '">°' + u + '</button>';
  }).join("");
  $("legend").innerHTML = '<span><i class="bar"></i>' + esc(t.legRain) + '</span><span><i class="dot"></i>' + esc(t.legSun) + '</span>' +
    (state.goal ? '<span><i class="band"></i>' + esc(t.legGoal) + '</span>' : '');
  $("about").textContent = t.about;
  $("foot").innerHTML = '<p>' + t.madeBy + '</p><p>' + esc(t.source) + '</p>';
}

function renderGoals(){
  var t = tr();
  $("goals").innerHTML = GOAL_KEYS.map(function(g){
    return '<button type="button" data-goal="' + g + '" aria-pressed="' + (g === state.goal) + '">' + esc(t.goals[g]) + '</button>';
  }).join("");
  if (state.goal){
    var ms = GOALS[state.goal].slice().sort(function(a, b){ return a - b; });
    // meses seguidos viram intervalo (ex.: julho a janeiro)
    var order = state.goal === "kite" ? [6,7,8,9,10,11,0] : ms;
    var names = order.map(function(i){ return monthName(i, "short"); });
    $("goal-note").innerHTML = fill(t.goalNote, {list: esc(names.join(", "))});
  } else {
    $("goal-note").innerHTML = "";
  }
}

function drawStrip(){
  var t = tr(), box = $("strip");
  var W = Math.max(280, Math.round(box.clientWidth || 760)), narrow = W < 520;
  var H = narrow ? 190 : 210, cw = W / 12;
  var barTop = 26, barBase = narrow ? 112 : 124, maxBar = barBase - barTop;
  var sunY = barBase + (narrow ? 26 : 30), labelY = H - 26;
  var maxRain = 400, svg = "";
  var good = state.goal ? GOALS[state.goal] : [];
  DATA.forEach(function(d, i){
    var x = i * cw, cx = x + cw / 2, sel = i === state.month;
    var bw = Math.min(cw * 0.5, 26), bh = Math.max(3, d.rain / maxRain * maxBar);
    var sunPerDay = d.sunh / DAYS[i], r = 3 + (sunPerDay - 4.5) / (10 - 4.5) * (narrow ? 7 : 9);
    svg += '<g class="col" data-m="' + i + '" role="button" tabindex="0" aria-pressed="' + sel + '" aria-label="' + esc(monthName(i)) + '">' +
      '<rect x="' + (x + 2).toFixed(1) + '" y="4" width="' + (cw - 4).toFixed(1) + '" height="' + (H - 8) + '" rx="12" fill="' + (sel ? "#E6F1F8" : "transparent") + '"' + (sel ? ' stroke="#0B4F7A" stroke-width="1.5"' : '') + '/>' +
      '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (barBase - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="' + Math.min(5, bw / 3).toFixed(1) + '" fill="#1F7FB8" opacity="' + (sel ? 1 : .8) + '"/>' +
      ((!narrow || sel) ? '<text x="' + cx.toFixed(1) + '" y="' + (barBase - bh - 6).toFixed(1) + '" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="' + (narrow ? 10.5 : 11.5) + '" fill="#567085">' + Math.round(d.rain) + '</text>' : '') +
      '<line x1="' + (x + 6).toFixed(1) + '" x2="' + (x + cw - 6).toFixed(1) + '" y1="' + barBase + '" y2="' + barBase + '" stroke="#D8E3EB"/>' +
      '<circle cx="' + cx.toFixed(1) + '" cy="' + sunY + '" r="' + r.toFixed(1) + '" fill="#F2B705"/>' +
      '<text x="' + cx.toFixed(1) + '" y="' + labelY + '" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="700" font-size="' + (narrow ? 10.5 : 14) + '" fill="' + (sel ? "#0B4F7A" : "#0F2433") + '">' + esc(monthName(i, "short")) + '</text>' +
      (good.indexOf(i) >= 0 ? '<rect x="' + (cx - cw * 0.3).toFixed(1) + '" y="' + (labelY + 9) + '" width="' + (cw * 0.6).toFixed(1) + '" height="5" rx="2.5" fill="#F2B705"/>' : '') +
      '</g>';
  });
  svg += '<text x="6" y="16" font-family="Atkinson Hyperlegible, sans-serif" font-size="11" fill="#567085">mm</text>';
  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="group" aria-label="' + esc(t.monthGroup) + '">' + svg + '</svg>';
}

function meter(level){
  return '<span class="meter" aria-hidden="true">' + [1,2,3].map(function(k){ return '<i' + (k <= level ? ' class="on"' : '') + '></i>'; }).join("") + '</span>';
}

function renderMonth(){
  var t = tr(), i = state.month, d = DATA[i], v = verdict(i), st = VERDICT_STYLE[v];
  var sunPerDay = d.sunh / DAYS[i];
  $("month").innerHTML =
    '<div class="m-head"><h2>' + esc(monthName(i)) + '</h2>' +
      '<span class="verdict" style="background:' + st.bg + ';color:' + st.fg + '">' + esc(t.verdicts[v]) + '</span>' +
      '<p class="tip">' + esc(t.tips[i]) + '</p></div>' +
    '<ul class="stats">' +
      '<li><span class="k">' + esc(t.rain) + '</span><span class="v">' + num(Math.round(d.rain)) + ' mm<small>' + esc(fill(t.rainDays, {n: d.rdays})) + '</small></span></li>' +
      '<li><span class="k">' + esc(t.sun) + '</span><span class="v">' + esc(fill(t.sunVal, {h: num(sunPerDay, 1)})) + '</span></li>' +
      '<li><span class="k">' + esc(t.temp) + '</span><span class="v">' + temp(d.max) + ' / ' + temp(d.min) + '</span></li>' +
      '<li><span class="k">' + esc(t.sea) + '</span><span class="v">≈ ' + temp(d.sea) + '</span></li>' +
      '<li><span class="k">' + esc(t.wind) + '</span><span class="v">' + esc(t.levels[d.wind - 1]) + meter(d.wind) + '</span></li>' +
      '<li><span class="k">' + esc(t.crowd) + '</span><span class="v">' + esc(t.crowds[d.crowd - 1]) + meter(d.crowd) + '</span></li>' +
    '</ul>';
}

function renderAll(){ renderStatic(); renderGoals(); drawStrip(); renderMonth(); postHeight(); }

/* ================= Eventos ================= */
$("langs").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  state.lang = b.getAttribute("data-lang"); renderAll();
});
$("units").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  state.unit = b.getAttribute("data-unit"); store("hnc-temp", state.unit); renderAll();
});
$("goals").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  var g = b.getAttribute("data-goal");
  state.goal = state.goal === g ? null : g;
  if (state.goal && GOALS[state.goal].indexOf(state.month) < 0){
    // leva o visitante ao primeiro mês recomendado a partir de agora
    var now = new Date(Date.now() - 3 * 3600e3).getUTCMonth();
    for (var k = 0; k < 12; k++){ var m = (now + k) % 12; if (GOALS[state.goal].indexOf(m) >= 0){ state.month = m; break; } }
  }
  renderAll();
});
function pickMonth(e){
  var g = e.target.closest(".col"); if (!g) return;
  state.month = +g.getAttribute("data-m"); drawStrip(); renderMonth(); postHeight();
}
$("strip").addEventListener("click", pickMonth);
$("strip").addEventListener("keydown", function(e){
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pickMonth(e); }
  if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
    state.month = (state.month + (e.key === "ArrowRight" ? 1 : 11)) % 12; drawStrip(); renderMonth();
    var c = document.querySelector('.col[data-m="' + state.month + '"]'); if (c) c.focus();
  }
});

var lastH = 0;
function postHeight(){
  var h = Math.ceil(document.documentElement.scrollHeight);
  if (h !== lastH && window.parent !== window){ lastH = h; window.parent.postMessage({hncTool:"quando-ir", height:h}, "*"); }
}
var lastW = 0;
if (window.ResizeObserver){
  new ResizeObserver(function(){
    var w = document.body.clientWidth;
    if (w !== lastW){ lastW = w; drawStrip(); }
    postHeight();
  }).observe(document.body);
}
document.fonts && document.fonts.ready.then(drawStrip);

renderAll();
})();
</script>
</body>
</html>
