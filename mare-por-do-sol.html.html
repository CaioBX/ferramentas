<style>
  :root{
    --ink:#0F2433;
    --muted:#567085;
    --paper:#FFFFFF;
    --mist:#F0F5F9;
    --line:#D8E3EB;
    --ocean:#0B4F7A;
    --sea:#1F7FB8;
    --sun:#F2B705;
    --sun-deep:#8A6200;
    --radius-lg:22px;
    --radius-sm:10px;
    --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .tool{max-width:820px;margin:0 auto;padding:20px 16px 18px}
  button,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  /* Cabeçalho */
  .top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .top h1{font-family:var(--display);font-weight:700;font-size:clamp(1.65rem,4.6vw,2.35rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-variation-settings:"opsz" 96}
  .lead{margin:0;color:var(--muted);max-width:52ch}
  .langs{display:flex;background:var(--mist);border-radius:999px;padding:3px;gap:2px}
  .langs button{border:0;background:none;padding:6px 10px;border-radius:999px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:.02em}
  .langs button[aria-pressed="true"]{background:var(--paper);color:var(--ocean);box-shadow:0 1px 2px rgba(15,36,51,.12)}

  /* Controles */
  .controls{margin-top:18px;display:grid;gap:12px}
  .beach-field{position:relative}
  .beach-field label{position:absolute;left:16px;top:8px;font-size:.75rem;color:var(--muted)}
  .beach-field select{appearance:none;-webkit-appearance:none;width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);padding:26px 44px 9px 16px;font-family:var(--display);font-weight:700;font-size:1.2rem;cursor:pointer}
  .beach-field::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--ocean);border-bottom:2.5px solid var(--ocean);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .days::-webkit-scrollbar{display:none}
  .days button{flex:0 0 auto;min-width:64px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:center;line-height:1.2}
  .days button span{display:block}
  .days .wd{font-size:.78rem;color:var(--muted)}
  .days .dn{font-family:var(--display);font-weight:700;font-size:1.1rem}
  .days button[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:#fff}
  .days button[aria-pressed="true"] .wd{color:#CFE4F2}

  /* Horizonte: o gráfico do dia */
  .horizon{margin-top:16px}
  .chart{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:#0E2A44;min-height:200px}
  .chart svg{display:block;width:100%}
  .chart .msg{position:absolute;inset:auto 16px 16px 16px;color:#fff;font-size:.92rem}
  .insight{margin:14px 2px 0;font-size:1.06rem;line-height:1.45;max-width:62ch}
  .insight strong{font-family:var(--display);font-weight:700}
  .next{margin:6px 2px 0;color:var(--muted);font-size:.92rem}
  .retry{margin-left:6px;border:0;background:none;color:var(--sea);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

  /* Almanaque do dia */
  .almanac{margin-top:20px;display:grid;grid-template-columns:1.1fr 1fr 1fr;border-top:1.5px solid var(--ink)}
  .almanac section{padding:14px 18px 6px 0}
  .almanac section + section{padding-left:18px;border-left:1px solid var(--line)}
  .almanac h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 10px}
  .rows{list-style:none;margin:0;padding:0}
  .rows li{display:grid;grid-template-columns:18px 1fr auto;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .rows li:last-child{border-bottom:0}
  .rows .k{color:var(--muted);font-size:.9rem}
  .rows .v{font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;text-align:right}
  .rows .v small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--muted)}
  .rows.sun li{grid-template-columns:1fr auto}
  .glyph{width:14px;height:14px;align-self:center}
  .empty{color:var(--muted);font-size:.9rem;margin:0}
  .moon{display:flex;gap:14px;align-items:center}
  .moon svg{flex:0 0 auto}
  .moon .name{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.2}
  .moon .pct{color:var(--muted);font-size:.88rem}
  .moon-note{margin:10px 0 0;font-size:.9rem;line-height:1.45}

  /* Sobre a praia */
  .about{margin-top:18px;background:var(--mist);border-radius:var(--radius-lg);padding:18px 20px}
  .about h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0}
  .about .city{color:var(--muted);font-size:.9rem;margin:0 0 8px}
  .about p.tip{margin:0;max-width:64ch}
  .about a{display:inline-block;margin-top:10px;color:var(--ocean);font-weight:700}

  footer{margin-top:16px;color:var(--muted);font-size:.8rem;line-height:1.5}
  footer p{margin:0 0 4px}
  footer a{color:inherit}
  footer .brand{color:var(--ink);font-weight:700}

  @media (max-width:640px){
    .almanac{grid-template-columns:1fr 1fr}
    .almanac section:first-child{grid-column:1 / -1;padding-right:0}
    .almanac section:nth-child(2){padding-left:0;border-left:0}
    .almanac section:nth-child(2),.almanac section:nth-child(3){border-top:1px solid var(--line)}
  }
  @media (max-width:380px){
    .almanac{grid-template-columns:1fr}
    .almanac section + section{padding-left:0;border-left:0}
  }
</style>
</head>

    </div>

  <div class="controls">
    <div class="beach-field">
      <label for="beach" id="t-beach"></label>
      <select id="beach"></select>
    </div>
    <div class="days" id="days" role="group"></div>

  <section class="horizon">

  <div class="almanac">

  <section class="about" id="about"></section>

  <footer id="foot"></footer>
</main>

/* ================= Tempo (Ceará: UTC−3, sem horário de verão) ================= */
var OFFSET = -3 * 3600e3, HOUR = 3600e3, DAY = 864e5;
function lp(t){ var d = new Date(t + OFFSET); return {y:d.getUTCFullYear(), m:d.getUTCMonth(), d:d.getUTCDate(), h:d.getUTCHours(), mi:d.getUTCMinutes()}; }
function dayStartOf(t){ var p = lp(t); return Date.UTC(p.y, p.m, p.d) - OFFSET; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function fmtTime(t){ var p = lp(Math.round(t / 60000) * 60000); return pad(p.h) + ":" + pad(p.mi); }
function fmtDur(ms){ var m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60); m = m % 60; return h ? h + " h " + (m ? pad(m) + " min" : "") : m + " min"; }

/* ================= Sol (algoritmo do SunCalc / NOAA) ================= */
var rad = Math.PI / 180, J1970 = 2440588, J2000 = 2451545, OBL = rad * 23.4397, J0 = 0.0009;
function toDays(t){ return t / DAY - 0.5 + J1970 - J2000; }
function fromJulian(j){ return (j + 0.5 - J1970) * DAY; }
function sunTimes(t, lat, lng){
  var lw = rad * -lng, phi = rad * lat, d = toDays(t);
  var n = Math.round(d - J0 - lw / (2 * Math.PI));
  var ds = J0 + lw / (2 * Math.PI) + n;
  var M = rad * (357.5291 + 0.98560028 * ds);
  var C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  var L = M + C + rad * 102.9372 + Math.PI;
  var dec = Math.asin(Math.sin(OBL) * Math.sin(L));
  var Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  function at(h){
    var w = Math.acos((Math.sin(h * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
    var a = J0 + (w + lw) / (2 * Math.PI) + n;
    var Jset = J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    return {rise: fromJulian(Jnoon - (Jset - Jnoon)), set: fromJulian(Jset)};
  }
  var s = at(-0.833), g = at(6), c = at(-6);
  return {sunrise:s.rise, sunset:s.set, golden:g.set, dawn:c.rise, dusk:c.set};
}

/* ================= Lua ================= */
function moonInfo(t){
  var syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  var p = ((t - ref) / DAY / syn) % 1; if (p < 0) p += 1;
  var illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
  var idx = Math.floor(p * 8 + 0.5) % 8;
  var dSyz = Math.min(p, 1 - p, Math.abs(p - 0.5));
  var dQuad = Math.min(Math.abs(p - 0.25), Math.abs(p - 0.75));
  return {p:p, illum:illum, idx:idx, spring:dSyz < 0.085, neap:dQuad < 0.085};
}
function moonSVG(p, size){
  var R = size / 2 - 2, c = size / 2, waxing = p < 0.5;
  var rx = Math.abs(Math.cos(2 * Math.PI * p)) * R;
  var illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
  // Hemisfério sul: lua crescente iluminada à esquerda
  var s1 = waxing ? 0 : 1;
  var s2 = illum < 0.5 ? (waxing ? 1 : 0) : (waxing ? 0 : 1);
  var lit = "M" + c + "," + (c - R) + " A" + R + "," + R + " 0 0 " + s1 + " " + c + "," + (c + R) +
            " A" + rx.toFixed(2) + "," + R + " 0 0 " + s2 + " " + c + "," + (c - R) + " Z";
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
    '<circle cx="' + c + '" cy="' + c + '" r="' + R + '" fill="#1C3A55"/>' +
    (illum > 0.01 ? '<path d="' + lit + '" fill="#F4EFD9"/>' : '') +
    '<circle cx="' + c + '" cy="' + c + '" r="' + R + '" fill="none" stroke="#0F2433" stroke-opacity=".25"/></svg>';
}

/* ================= Maré (Open-Meteo) ================= */
var tideCache = {};
function tideURL(b){
  var base = CONFIG.apiKey ? "https://customer-marine-api.open-meteo.com/v1/marine" : "https://marine-api.open-meteo.com/v1/marine";
  return base + "?latitude=" + b.lat + "&longitude=" + b.lon +
    "&hourly=sea_level_height_msl&timezone=America%2FFortaleza&past_days=1&forecast_days=8&cell_selection=sea" +
    (CONFIG.apiKey ? "&apikey=" + encodeURIComponent(CONFIG.apiKey) : "");
}
function loadTide(b){
  if (tideCache[b.id]) return tideCache[b.id];
  var pr = fetch(tideURL(b)).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(j){
    var off = (j.utc_offset_seconds || 0) * 1000, hs = j.hourly.sea_level_height_msl, pts = [];
    j.hourly.time.forEach(function(s, i){
      var h = hs[i]; if (h == null || !isFinite(h)) return;
      var dd = s.split("T")[0].split("-"), tt = s.split("T")[1].split(":");
      pts.push({t: Date.UTC(+dd[0], +dd[1] - 1, +dd[2], +tt[0], +tt[1]) - off, h: h});
    });
    if (pts.length < 24) throw new Error("sem dados");
    return {pts: pts, ext: extremes(pts)};
  });
  tideCache[b.id] = pr;
  pr.catch(function(){ delete tideCache[b.id]; });
  return pr;
}
function extremes(pts){
  var out = [];
  for (var i = 1; i < pts.length - 1; i++){
    var a = pts[i-1].h, b = pts[i].h, c = pts[i+1].h;
    var hi = b > a && b >= c, lo = b < a && b <= c;
    if (!hi && !lo) continue;
    var den = a - 2 * b + c, o = den !== 0 ? (a - c) / (2 * den) : 0;
    o = Math.max(-0.5, Math.min(0.5, o));
    var step = o >= 0 ? pts[i+1].t - pts[i].t : pts[i].t - pts[i-1].t;
    out.push({type: hi ? "high" : "low", t: pts[i].t + o * step, h: b - (a - c) * o / 4});
  }
  // remove oscilações pequenas que não são marés de verdade
  var changed = true;
  while (changed){
    changed = false;
    for (var k = 0; k < out.length - 1; k++){
      if (out[k].type === out[k+1].type){
        var keep = out[k].type === "high" ? (out[k].h >= out[k+1].h ? k : k+1) : (out[k].h <= out[k+1].h ? k : k+1);
        out.splice(keep === k ? k + 1 : k, 1); changed = true; break;
      }
      if (Math.abs(out[k+1].h - out[k].h) < 0.08){ out.splice(k, 2); changed = true; break; }
    }
  }
  return out;
}

/* ================= Estado ================= */
var params = new URLSearchParams(location.search);
var state = {
  lang: detectLang(),
  beach: BEACHES.filter(function(b){ return b.id === params.get("praia"); })[0] || BEACHES[0],
  day: 0,
  tide: null, tideStatus: "loading"
};

function detectLang(){
  var q = (params.get("lang") || "").toLowerCase();
  if (LANGS.indexOf(q) >= 0) return q;
  var host = "", path = "";
  try { if (location.ancestorOrigins && location.ancestorOrigins.length) host = new URL(location.ancestorOrigins[0]).hostname; } catch(e){}
  try { if (document.referrer){ var u = new URL(document.referrer); host = host || u.hostname; path = u.pathname; } } catch(e){}
  var m = host.match(/^(en|es|fr|it)\./) || path.match(/^\/(en|es|fr|it)(\/|$)/);
  if (m) return m[1];
  if (/hojenoceara\.com\.br$/.test(host)) return "pt";
  var nav = (navigator.language || "pt").slice(0, 2).toLowerCase();
  return LANGS.indexOf(nav) >= 0 ? nav : "pt";
}
function tr(){ return T[state.lang]; }
function fill(s, o){ return s.replace(/\{(\w+)\}/g, function(_, k){ return o[k] != null ? o[k] : ""; }); }
function fmtHeight(h){
  return new Intl.NumberFormat(LOCALE[state.lang], {minimumFractionDigits:1, maximumFractionDigits:1, signDisplay:"exceptZero"}).format(Math.round(h * 10) / 10).replace("-", "−") + " m";
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

/* ================= Interface ================= */
var $ = function(id){ return document.getElementById(id); };
var today0 = dayStartOf(Date.now());

function renderStatic(){
  var t = tr();
  document.documentElement.lang = LOCALE[state.lang];
  document.title = t.title;
  $("t-title").textContent = t.title;
  $("t-lead").textContent = t.lead;
  $("t-beach").textContent = t.beach;
  $("t-tides").textContent = t.tides;
  $("t-sun").textContent = t.sun;
  $("t-moon").textContent = t.moon;
  $("langs").setAttribute("aria-label", t.langGroup);
  $("days").setAttribute("aria-label", t.dayGroup);

  $("langs").innerHTML = LANGS.map(function(l){
    return '<button type="button" data-lang="' + l + '" aria-pressed="' + (l === state.lang) + '" lang="' + LOCALE[l] + '">' + l.toUpperCase() + '</button>';
  }).join("");

  var groups = ["oeste","fortaleza","leste"];
  $("beach").innerHTML = groups.map(function(g){
    return '<optgroup label="' + esc(t.regions[g]) + '">' + BEACHES.filter(function(b){ return b.region === g; }).map(function(b){
      return '<option value="' + b.id + '"' + (b.id === state.beach.id ? " selected" : "") + '>' + esc(b.name) + '</option>';
    }).join("") + '</optgroup>';
  }).join("");

  var wdf = new Intl.DateTimeFormat(LOCALE[state.lang], {weekday:"short", timeZone:"UTC"});
  var html = "";
  for (var i = 0; i < 8; i++){
    var ds = today0 + i * DAY, dt = new Date(ds + OFFSET);
    var wd = i === 0 ? t.today : i === 1 ? t.tomorrow : wdf.format(dt).replace(".", "");
    wd = wd.charAt(0).toUpperCase() + wd.slice(1);
    html += '<button type="button" data-day="' + i + '" aria-pressed="' + (i === state.day) + '"><span class="wd">' + esc(wd) + '</span><span class="dn">' + dt.getUTCDate() + '</span></button>';
  }
  $("days").innerHTML = html;

  $("foot").innerHTML = '<p>' + t.madeBy + '</p><p>' + t.heightNote + ' ' + t.disclaimer + '</p><p>' + t.source + '</p>';
}

function dayData(){
  var b = state.beach, ds = today0 + state.day * DAY;
  var sun = sunTimes(ds + 12 * HOUR, b.lat, b.lon);
  var ext = state.tide ? state.tide.ext.filter(function(e){ return e.t >= ds && e.t < ds + DAY; }) : [];
  return {ds: ds, sun: sun, ext: ext, moon: moonInfo(ds + 12 * HOUR)};
}

function render(){
  var t = tr(), d = dayData(), b = state.beach;
  drawChart(d);

  // Frase principal do dia
  var ins = "", nextTxt = "";
  if (state.tideStatus === "loading"){
    ins = t.loading;
  } else if (state.tideStatus === "error"){
    ins = esc(t.error) + ' ' + fill(t.insightSunset, {time: fmtTime(d.sun.sunset)}) + ' <button type="button" class="retry" id="retry">' + esc(t.retry) + '</button>';
  } else {
    var dayLows = d.ext.filter(function(e){ return e.type === "low" && e.t > d.sun.sunrise && e.t < d.sun.sunset; });
    if (dayLows.length){
      var best = dayLows.reduce(function(a, c){ return c.h < a.h ? c : a; });
      ins = fill(t.insightLow, {
        time: fmtTime(best.t), height: fmtHeight(best.h),
        from: fmtTime(Math.max(best.t - 90 * 60e3, d.sun.sunrise)),
        to: fmtTime(Math.min(best.t + 90 * 60e3, d.sun.sunset))
      });
    } else if (d.ext.length){
      ins = esc(t.insightNight);
    } else {
      ins = esc(t.noTides);
    }
    ins += " " + fill(t.insightSunset, {time: fmtTime(d.sun.sunset)});
    if (state.day === 0){
      var now = Date.now();
      var nx = state.tide.ext.filter(function(e){ return e.t > now; })[0];
      if (nx) nextTxt = fill(t.next, {type: nx.type === "high" ? t.highL : t.lowL, dur: fmtDur(nx.t - now).trim()});
    }
  }
  $("insight").innerHTML = ins;
  $("next").textContent = nextTxt;
  var rb = $("retry"); if (rb) rb.onclick = function(){ fetchTide(); };

  // Marés do dia
  if (state.tideStatus === "ok" && d.ext.length){
    $("tides").innerHTML = '<ul class="rows">' + d.ext.map(function(e){
      var up = e.type === "high";
      var g = up ? '<svg class="glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2 L13 11 H1 Z" fill="#1F7FB8"/></svg>'
                 : '<svg class="glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12 L1 3 H13 Z" fill="#8A6200"/></svg>';
      return '<li>' + g + '<span class="k">' + (up ? t.high : t.low) + '</span><span class="v">' + fmtTime(e.t) + '<small>' + fmtHeight(e.h) + '</small></span></li>';
    }).join("") + '</ul>';
  } else {
    $("tides").innerHTML = '<p class="empty">' + esc(state.tideStatus === "loading" ? t.loading : t.noTides) + '</p>';
  }

  // Sol
  $("sun").innerHTML =
    '<li><span class="k">' + t.sunrise + '</span><span class="v">' + fmtTime(d.sun.sunrise) + '</span></li>' +
    '<li><span class="k">' + t.golden + '</span><span class="v">' + fmtTime(d.sun.golden) + '</span></li>' +
    '<li><span class="k">' + t.sunset + '</span><span class="v">' + fmtTime(d.sun.sunset) + '</span></li>' +
    '<li><span class="k">' + t.dayLength + '</span><span class="v">' + fmtDur(d.sun.sunset - d.sun.sunrise).trim() + '</span></li>';

  // Lua
  var mo = d.moon;
  $("moon").innerHTML = '<div class="moon">' + moonSVG(mo.p, 56) + '<div><div class="name">' + esc(t.phases[mo.idx]) + '</div><div class="pct">' +
    fill(t.lit, {n: Math.round(mo.illum * 100)}) + '</div></div></div>' +
    (mo.spring ? '<p class="moon-note">' + esc(t.spring) + '</p>' : mo.neap ? '<p class="moon-note">' + esc(t.neap) + '</p>' : '');

  // Sobre a praia
  var link = CONFIG.guides[b.id];
  if (link && state.lang !== "pt"){
    try { var u = new URL(link); u.hostname = state.lang + ".hojenoceara.com.br"; link = u.toString(); } catch(e){}
  }
  $("about").innerHTML = '<h2>' + esc(b.name) + '</h2><p class="city">' + esc(b.city) + ', Ceará</p><p class="tip">' + esc(t.tips[b.id]) + '</p>' +
    (link ? '<a href="' + esc(link) + '" target="_top">' + esc(t.guide) + '</a>' : '');

  postHeight();
}

/* ================= Gráfico: o dia como um horizonte ================= */
function drawChart(d){
  var box = $("chart"), W = Math.max(280, Math.round(box.clientWidth || 700));
  var H = W < 520 ? 220 : 260, top = 40, bottom = H - 28;
  var ds = d.ds, x = function(t){ return (t - ds) / DAY * W; };
  var f = function(t){ return Math.max(0, Math.min(1, (t - ds) / DAY)); };
  var s = d.sun;
  var stops = [
    [0, "#0E2A44"], [f(s.dawn - 40 * 60e3), "#0E2A44"], [f(s.dawn), "#4A5B80"], [f(s.sunrise), "#F3B867"],
    [f(s.sunrise + 90 * 60e3), "#CFE7F6"], [f(s.sunset - 90 * 60e3), "#CFE7F6"], [f(s.sunset), "#F2A65A"],
    [f(s.dusk), "#4A5B80"], [f(s.dusk + 40 * 60e3), "#0E2A44"], [1, "#0E2A44"]
  ];
  var g = '<defs><linearGradient id="sky" x1="0" x2="1" y1="0" y2="0">' +
    stops.map(function(st){ return '<stop offset="' + (st[0] * 100).toFixed(2) + '%" stop-color="' + st[1] + '"/>'; }).join("") +
    '</linearGradient><linearGradient id="haze" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>' +
    '<linearGradient id="water" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2A8BCB"/><stop offset="1" stop-color="#0A3F63"/></linearGradient>' +
    '<clipPath id="clip"><rect x="0" y="0" width="' + W + '" height="' + bottom + '"/></clipPath></defs>';
  var svg = g + '<rect width="' + W + '" height="' + bottom + '" fill="url(#sky)"/><rect width="' + W + '" height="' + bottom + '" fill="url(#haze)"/>';

  var isDay = function(t){ return t > s.sunrise && t < s.sunset; };
  var t = tr();

  if (state.tide){
    var all = state.tide.pts, lo = Infinity, hi = -Infinity;
    all.forEach(function(p){ if (p.h < lo) lo = p.h; if (p.h > hi) hi = p.h; });
    lo -= 0.25; hi += 0.25;
    var y0 = top + (bottom - top) * 0.28, y1 = bottom - 6;
    var y = function(h){ return y0 + (hi - h) / (hi - lo) * (y1 - y0); };
    var pts = all.filter(function(p){ return p.t >= ds - 3 * HOUR && p.t <= ds + DAY + 3 * HOUR; })
                 .map(function(p){ return [x(p.t), y(p.h)]; });
    if (pts.length > 3){
      var path = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);
      for (var i = 0; i < pts.length - 1; i++){
        var p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
        path += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + "," + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + " " +
                (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + "," + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + " " +
                p2[0].toFixed(1) + "," + p2[1].toFixed(1);
      }
      var area = path + " L" + pts[pts.length-1][0].toFixed(1) + "," + bottom + " L" + pts[0][0].toFixed(1) + "," + bottom + " Z";
      svg += '<g clip-path="url(#clip)"><path d="' + area + '" fill="url(#water)" opacity=".95"/>' +
             '<path d="' + path + '" fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".9"/></g>';

      d.ext.forEach(function(e){
        var ex = x(e.t), ey = y(e.h), dayLight = isDay(e.t);
        var tx = Math.max(26, Math.min(W - 26, ex));
        var ink = dayLight ? "#0F2433" : "#FFFFFF", halo = dayLight ? "#E6F2FA" : "#0E2A44";
        svg += '<circle cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="5" fill="#fff" stroke="' + (e.type === "high" ? "#0B4F7A" : "#8A6200") + '" stroke-width="2.5"/>' +
          '<text x="' + tx.toFixed(1) + '" y="' + (ey - 26).toFixed(1) + '" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="700" font-size="15" fill="' + ink + '" stroke="' + halo + '" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + fmtTime(e.t) + '</text>' +
          '<text x="' + tx.toFixed(1) + '" y="' + (ey - 11).toFixed(1) + '" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" fill="' + ink + '" stroke="' + halo + '" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + fmtHeight(e.h) + '</text>';
      });
    }
  } else {
    var calm = bottom - (bottom - top) * 0.32;
    svg += '<rect x="0" y="' + calm + '" width="' + W + '" height="' + (bottom - calm) + '" fill="url(#water)" opacity="' + (state.tideStatus === "loading" ? ".55" : ".35") + '"/>';
  }

  // Nascer e pôr do sol no alto do gráfico
  [[s.sunrise, true], [s.sunset, false]].forEach(function(o){
    var sx = x(o[0]);
    var anchor = o[1] ? "start" : "end", lx = o[1] ? sx + 12 : sx - 12;
    svg += '<line x1="' + sx.toFixed(1) + '" x2="' + sx.toFixed(1) + '" y1="26" y2="' + bottom + '" stroke="#fff" stroke-opacity=".55" stroke-dasharray="2 4"/>' +
      '<circle cx="' + sx.toFixed(1) + '" cy="20" r="6.5" fill="#F2B705" stroke="#fff" stroke-width="2"/>' +
      '<text x="' + lx.toFixed(1) + '" y="25" text-anchor="' + anchor + '" font-family="Bricolage Grotesque, sans-serif" font-weight="700" font-size="14" fill="#0F2433" stroke="#E9F4FB" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' +
      (W < 560 ? "" : esc(o[1] ? t.sunrise : t.sunset) + ' ') + fmtTime(o[0]) + '</text>';
  });

  // Agora (o selo fica por cima; a linha fica atrás dos rótulos)
  if (state.day === 0){
    var nx = x(Date.now());
    svg = svg.replace('<g clip-path', '<line x1="' + nx.toFixed(1) + '" x2="' + nx.toFixed(1) + '" y1="34" y2="' + bottom + '" stroke="#F2B705" stroke-width="2"/><g clip-path');
    if (!state.tide) svg += '<line x1="' + nx.toFixed(1) + '" x2="' + nx.toFixed(1) + '" y1="34" y2="' + bottom + '" stroke="#F2B705" stroke-width="2"/>';
    svg += '<rect x="' + (nx - 30).toFixed(1) + '" y="' + (bottom - 24) + '" width="60" height="18" rx="9" fill="#F2B705"/>' +
      '<text x="' + nx.toFixed(1) + '" y="' + (bottom - 11) + '" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="11" fill="#0F2433">' + esc(t.now) + '</text>';
  }

  // Horas
  var ticks = W < 520 ? [0, 6, 12, 18, 24] : [0, 3, 6, 9, 12, 15, 18, 21, 24];
  svg += '<rect y="' + bottom + '" width="' + W + '" height="' + (H - bottom) + '" fill="#0A3352"/>';
  ticks.forEach(function(h){
    var tx = h / 24 * W, anchor = h === 0 ? "start" : h === 24 ? "end" : "middle";
    svg += '<text x="' + (h === 0 ? 10 : h === 24 ? W - 10 : tx).toFixed(1) + '" y="' + (bottom + 18) + '" text-anchor="' + anchor + '" font-family="Atkinson Hyperlegible, sans-serif" font-size="11.5" fill="#BFD6E6">' + pad(h % 24) + ':00</text>';
  });

  var dateTxt = new Intl.DateTimeFormat(LOCALE[state.lang], {day:"numeric", month:"long", timeZone:"UTC"}).format(new Date(ds + OFFSET));
  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(fill(t.chartLabel, {beach: state.beach.name, date: dateTxt})) + '">' + svg + '</svg>';
}

/* ================= Eventos ================= */
function fetchTide(){
  var b = state.beach;
  state.tide = null; state.tideStatus = "loading"; render();
  loadTide(b).then(function(data){
    if (state.beach !== b) return;
    state.tide = data; state.tideStatus = "ok"; render();
  }).catch(function(){
    if (state.beach !== b) return;
    state.tideStatus = "error"; render();
  });
}

$("langs").addEventListener("click", function(e){
  var btn = e.target.closest("button"); if (!btn) return;
  state.lang = btn.getAttribute("data-lang"); renderStatic(); render();
});
$("days").addEventListener("click", function(e){
  var btn = e.target.closest("button"); if (!btn) return;
  state.day = +btn.getAttribute("data-day");
  Array.prototype.forEach.call($("days").children, function(c){ c.setAttribute("aria-pressed", c === btn); });
  render();
});
$("beach").addEventListener("change", function(e){
  state.beach = BEACHES.filter(function(b){ return b.id === e.target.value; })[0];
  fetchTide();
});

/* Ajusta a altura do iframe na página do portal */
var lastH = 0;
function postHeight(){
  var h = Math.ceil(document.documentElement.scrollHeight);
  if (h !== lastH && window.parent !== window){ lastH = h; window.parent.postMessage({hncTool:"mare-por-do-sol", height:h}, "*"); }
}
var lastW = 0;
if (window.ResizeObserver){
  new ResizeObserver(function(){
    var w = $("chart").clientWidth;
    if (w !== lastW){ lastW = w; render(); } else postHeight();
  }).observe(document.body);
}
document.fonts && document.fonts.ready.then(render);
setInterval(function(){ if (state.day === 0) render(); }, 5 * 60e3);

renderStatic();
fetchTide();
})();
</script>
</body>
</html>
