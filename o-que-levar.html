<style>
  :root{
    --ink:#0F2433;
    --muted:#567085;
    --paper:#FFFFFF;
    --mist:#F0F5F9;
    --line:#D8E3EB;
    --ocean:#0B4F7A;
    --night:#0E2A44;
    --sea:#1F7FB8;
    --sun:#F2B705;
    --radius-lg:22px;
    --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .tool{max-width:820px;margin:0 auto;padding:20px 16px 18px}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  .top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .top h1{font-family:var(--display);font-weight:700;font-size:clamp(1.65rem,4.6vw,2.35rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-variation-settings:"opsz" 96}
  .lead{margin:0;color:var(--muted);max-width:54ch}
  .seg{display:flex;background:var(--mist);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:0;background:none;padding:6px 10px;border-radius:999px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--paper);color:var(--ocean);box-shadow:0 1px 2px rgba(15,36,51,.12)}

  /* Perguntas */
  .setup{margin-top:18px;display:grid;gap:14px}
  .q-label{font-size:.82rem;color:var(--muted);margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:.92rem;cursor:pointer;line-height:1.25}
  .chips button[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:#fff}
  .months{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .months::-webkit-scrollbar{display:none}
  .months button{flex:0 0 auto;min-width:46px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 6px;font-size:.86rem;font-weight:700;cursor:pointer}
  .months button[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:#fff}
  .months button.rainy{border-bottom:3px solid var(--sea)}
  .row2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  .days{max-width:360px}
  .days{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:6px 14px;min-width:240px}
  .days input{flex:1;accent-color:var(--ocean);height:26px}
  .days output{font-family:var(--display);font-weight:700;font-size:1.1rem;min-width:70px;text-align:right}

  /* Etiqueta de progresso */
  .tag{margin-top:20px;background:var(--night);color:#fff;border-radius:var(--radius-lg);padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;align-items:center;position:relative}
  .tag::before{content:"";position:absolute;left:22px;top:-9px;width:46px;height:18px;border-radius:9px;border:4px solid var(--night);background:var(--paper)}
  .tag .big{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.05;letter-spacing:-.02em;margin:0}
  .tag .big b{color:var(--sun)}
  .tag .sub{margin:2px 0 0;color:#BFD6E6;font-size:.92rem}
  .bar{grid-column:1 / -1;height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--sun);border-radius:5px;transition:width .3s}
  .acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;padding:8px 13px;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none;line-height:1.2}
  .btn svg{width:17px;height:17px}
  .btn.wa{background:#1FA855;color:#fff}
  .btn.ghost{background:rgba(255,255,255,.1);color:#fff}

  /* Lista */
  .sections{margin-top:6px;columns:2;column-gap:28px}
  .sec{break-inside:avoid;padding-top:18px}
  .sec h2{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
  .sec h2 span{font-family:var(--body);font-weight:400;font-size:.84rem;color:var(--muted)}
  .items{list-style:none;margin:0;padding:0}
  .item label{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
  .item input{position:absolute;opacity:0;width:1px;height:1px}
  .box{width:24px;height:24px;border-radius:7px;border:2px solid #9DB3C2;display:grid;place-items:center;margin-top:1px;background:var(--paper)}
  .box svg{width:15px;height:15px;opacity:0;color:var(--ink)}
  .item input:checked + .box{background:var(--sun);border-color:var(--sun)}
  .item input:checked + .box svg{opacity:1}
  .item input:focus-visible + .box{outline:3px solid var(--sea);outline-offset:2px}
  .txt{line-height:1.35}
  .txt .qty{display:inline-block;margin-left:6px;font-family:var(--display);font-weight:700;font-size:.82rem;color:var(--ocean);background:var(--mist);border-radius:6px;padding:0 6px}
  .txt small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
  .item input:checked ~ .txt .name{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(15,36,51,.35)}

  .note{margin-top:18px;background:var(--mist);border-radius:var(--radius-lg);padding:14px 18px;font-size:.92rem;color:var(--muted)}
  .note p{margin:0}
  footer{margin-top:16px;color:var(--muted);font-size:.8rem;line-height:1.5}
  footer p{margin:0 0 4px}
  footer .brand{color:var(--ink);font-weight:700}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:.9rem;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  @media (max-width:640px){
    .sections{columns:1}
    .row2{grid-template-columns:1fr;gap:14px}
    .days{min-width:0}
  }
  @media (prefers-reduced-motion: reduce){ .bar i,.toast{transition:none} }
  @media print{
    .top .seg,.setup,.acts,.note,.toast{display:none !important}
    .tag{background:none;color:var(--ink);border:1.5px solid var(--ink);padding:10px 14px}
    .tag::before,.bar{display:none}
    .tag .sub{color:var(--muted)}
    .sections{columns:2}
  }
</style>
</head>
<body>
<main class="tool">
  <header class="top">
    <div>
      <h1 id="t-title"></h1>
      <p class="lead" id="t-lead"></p>
    </div>
    <div class="seg" role="group" id="langs"></div>
  </header>

  <div class="setup">
    <div><p class="q-label" id="t-where"></p><div class="chips" role="group" id="dests"></div></div>
    <div class="row2">
      <div>
        <p class="q-label" id="t-days"></p>
        <div class="days"><input type="range" id="days" min="1" max="21" step="1"><output id="days-out" for="days"></output></div>
      </div>
      <div style="min-width:0"><p class="q-label" id="t-when"></p><div class="months" role="group" id="months"></div></div>
    </div>
    <div><p class="q-label" id="t-doing"></p><div class="chips" role="group" id="acts"></div></div>
  </div>

  <section class="tag" id="tag" aria-live="polite"></section>
  <div class="sections" id="sections"></div>

  <div class="note"><p id="note"></p></div>
  <footer id="foot"></footer>
</main>
<div class="toast" id="toast" role="status"></div>

/* ================= Estado (salvo no navegador) ================= */
var KEY = "hnc-mala";
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify({dest:state.dest, days:state.days, month:state.month, acts:state.acts, checks:state.checks})); } catch(e){} }
var params = new URLSearchParams(location.search);
var saved = load();
var state = {
  lang: detectLang(),
  dest: DESTS.indexOf(params.get("destino")) >= 0 ? params.get("destino") : (DESTS.indexOf(saved.dest) >= 0 ? saved.dest : "fortaleza"),
  days: clamp(+saved.days || 7, 1, 21),
  month: saved.month >= 0 && saved.month <= 11 ? saved.month : new Date(Date.now() - 3 * 3600e3).getUTCMonth(),
  acts: Array.isArray(saved.acts) ? saved.acts.filter(function(a){ return ACTS.indexOf(a) >= 0; }) : [],
  checks: saved.checks && typeof saved.checks === "object" ? saved.checks : {}
};
if (params.get("atividade") && ACTS.indexOf(params.get("atividade")) >= 0 && state.acts.indexOf(params.get("atividade")) < 0) state.acts.push(params.get("atividade"));
function detectLang(){
  var q = (params.get("lang") || "").toLowerCase();
  if (LANGS.indexOf(q) >= 0) return q;
  var host = "", path = "";
  try { if (location.ancestorOrigins && location.ancestorOrigins.length) host = new URL(location.ancestorOrigins[0]).hostname; } catch(e){}
  try { if (document.referrer){ var u = new URL(document.referrer); host = host || u.hostname; path = u.pathname; } } catch(e){}
  var m = host.match(/^(en|es|fr|it)\./) || path.match(/^\/(en|es|fr|it)(\/|$)/);
  if (m) return m[1];
  if (/hojenoceara\.com\.br$/.test(host)) return "pt";
  var nav = (navigator.language || "pt").slice(0, 2).toLowerCase();
  return LANGS.indexOf(nav) >= 0 ? nav : "pt";
}
function tr(){ return T[state.lang]; }
function fill(s, o){ return s.replace(/\{(\w+)\}/g, function(_, k){ return o[k] != null ? o[k] : ""; }); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function monthName(i, style){ return new Intl.DateTimeFormat(LOCALE[state.lang], {month: style || "long", timeZone:"UTC"}).format(new Date(Date.UTC(2026, i, 15))).replace(".", ""); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
var $ = function(id){ return document.getElementById(id); };

function visibleItems(){ return ITEMS.filter(function(it){ return !it.show || it.show(state); }); }
function tipOf(it){ var tp = typeof it.tip === "function" ? it.tip(state) : it.tip; return tp ? tp[state.lang] : ""; }
function subLine(){
  var t = tr();
  return fill(t.sub, {dest: t.dests[state.dest], days: state.days === 1 ? t.day1 : fill(t.dayN, {n: state.days}), month: monthName(state.month)});
}

/* ================= Interface ================= */
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var ICON_WA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>';

function renderSetup(){
  var t = tr();
  document.documentElement.lang = LOCALE[state.lang];
  document.title = t.title;
  $("t-title").textContent = t.title;
  $("t-lead").textContent = t.lead;
  $("t-where").textContent = t.where;
  $("t-when").textContent = t.when;
  $("t-days").textContent = t.days;
  $("t-doing").textContent = t.doing;
  $("langs").setAttribute("aria-label", t.langGroup);
  $("dests").setAttribute("aria-label", t.where);
  $("months").setAttribute("aria-label", t.when);
  $("acts").setAttribute("aria-label", t.doing);
  $("langs").innerHTML = LANGS.map(function(l){
    return '<button type="button" data-lang="' + l + '" aria-pressed="' + (l === state.lang) + '" lang="' + LOCALE[l] + '">' + l.toUpperCase() + '</button>';
  }).join("");
  $("dests").innerHTML = DESTS.map(function(d){
    return '<button type="button" data-dest="' + d + '" aria-pressed="' + (d === state.dest) + '">' + esc(t.dests[d]) + '</button>';
  }).join("");
  $("acts").innerHTML = ACTS.map(function(a){
    return '<button type="button" data-act="' + a + '" aria-pressed="' + (state.acts.indexOf(a) >= 0) + '">' + esc(t.acts[a]) + '</button>';
  }).join("");
  var mh = "";
  for (var i = 0; i < 12; i++){
    var r = RAINY.indexOf(i) >= 0;
    mh += '<button type="button" data-m="' + i + '" aria-pressed="' + (i === state.month) + '"' + (r ? ' class="rainy" title="' + esc(t.rainyNote) + '"' : '') + ' aria-label="' + esc(cap(monthName(i)) + (r ? ", " + t.rainyNote : "")) + '">' + esc(cap(monthName(i, "short"))) + '</button>';
  }
  $("months").innerHTML = mh;
  $("days").value = state.days;
  $("days-out").textContent = state.days === 1 ? t.day1 : fill(t.dayN, {n: state.days});
  $("note").textContent = t.note;
  $("foot").innerHTML = '<p>' + t.madeBy + '</p>';
}

function renderList(){
  var t = tr(), items = visibleItems();
  $("sections").innerHTML = SECS.map(function(sec){
    var its = items.filter(function(it){ return it.sec === sec; });
    if (!its.length) return "";
    var done = its.filter(function(it){ return state.checks[it.id]; }).length;
    return '<section class="sec"><h2>' + esc(t.secs[sec]) + '<span>' + done + '/' + its.length + '</span></h2><ul class="items">' +
      its.map(function(it){
        var q = it.qty ? it.qty(state) : 0, tip = tipOf(it);
        return '<li class="item"><label><input type="checkbox" data-id="' + it.id + '"' + (state.checks[it.id] ? " checked" : "") + '><span class="box">' + CHECK + '</span>' +
          '<span class="txt"><span class="name">' + esc(it.t[state.lang]) + '</span>' + (q ? '<span class="qty">×' + q + '</span>' : '') + (tip ? '<small>' + esc(tip) + '</small>' : '') + '</span></label></li>';
      }).join("") + '</ul></section>';
  }).join("");
  renderTag();
}

function renderTag(){
  var t = tr(), items = visibleItems();
  var a = items.filter(function(it){ return state.checks[it.id]; }).length, b = items.length;
  $("tag").innerHTML =
    '<div><p class="big">' + (a === b && b ? esc(t.done) : fill(t.progress, {a: a, b: b})) + '</p><p class="sub">' + esc(subLine()) + '</p></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + b + '" aria-valuenow="' + a + '"><i style="width:' + (b ? Math.round(a / b * 100) : 0) + '%"></i></div>' +
    '<div class="acts">' +
      '<a class="btn wa" href="' + esc("https://wa.me/?text=" + encodeURIComponent(listText())) + '" target="_blank" rel="noopener">' + ICON_WA + esc(t.wa) + '</a>' +
      '<button type="button" class="btn ghost" data-do="copy">' + esc(t.copy) + '</button>' +
      '<button type="button" class="btn ghost" data-do="print">' + esc(t.print) + '</button>' +
      '<button type="button" class="btn ghost" data-do="clear">' + esc(t.clear) + '</button>' +
    '</div>';
}

function shareURL(){
  var u = CONFIG.shareURL;
  if (state.lang !== "pt"){ try { var x = new URL(u); x.hostname = state.lang + ".hojenoceara.com.br"; u = x.toString(); } catch(e){} }
  return u;
}
function listText(){
  var t = tr(), items = visibleItems(), out = [fill(t.shareTitle, {sub: subLine()}), ""];
  SECS.forEach(function(sec){
    var its = items.filter(function(it){ return it.sec === sec; });
    if (!its.length) return;
    out.push("*" + t.secs[sec] + "*");
    its.forEach(function(it){
      var q = it.qty ? " (×" + it.qty(state) + ")" : "";
      out.push((state.checks[it.id] ? "✅ " : "⬜ ") + it.t[state.lang] + q);
    });
    out.push("");
  });
  out.push(fill(t.shareFoot, {url: shareURL()}));
  return out.join("\n");
}

/* ================= Ações ================= */
var toastTimer = null;
function toast(msg){ var el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800); }
function copyText(text){
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(tr().copied); } catch(e){}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast(tr().copied); }, fallback);
  else fallback();
}

function refresh(){ save(); renderSetup(); renderList(); postHeight(); }

$("langs").addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return; state.lang = b.getAttribute("data-lang"); refresh(); });
$("dests").addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return; state.dest = b.getAttribute("data-dest"); refresh(); });
$("months").addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return; state.month = +b.getAttribute("data-m"); refresh(); });
$("acts").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  var a = b.getAttribute("data-act"), i = state.acts.indexOf(a);
  if (i >= 0) state.acts.splice(i, 1); else state.acts.push(a);
  refresh();
});
$("days").addEventListener("input", function(e){
  state.days = +e.target.value;
  var t = tr(); $("days-out").textContent = state.days === 1 ? t.day1 : fill(t.dayN, {n: state.days});
  save(); renderList();
});
$("sections").addEventListener("change", function(e){
  var c = e.target; if (!c.matches || !c.matches('input[type="checkbox"]')) return;
  var id = c.getAttribute("data-id");
  if (c.checked) state.checks[id] = 1; else delete state.checks[id];
  save();
  // atualiza contadores sem redesenhar a lista (mantém o foco)
  var sec = c.closest(".sec"), boxes = sec.querySelectorAll('input[type="checkbox"]'), n = 0;
  Array.prototype.forEach.call(boxes, function(x){ if (x.checked) n++; });
  sec.querySelector("h2 span").textContent = n + "/" + boxes.length;
  renderTag();
});
$("tag").addEventListener("click", function(e){
  var b = e.target.closest("button[data-do]"); if (!b) return;
  var d = b.getAttribute("data-do");
  if (d === "copy") copyText(listText());
  else if (d === "print") window.print();
  else if (d === "clear"){ state.checks = {}; save(); renderList(); }
});

var lastH = 0;
function postHeight(){
  var h = Math.ceil(document.documentElement.scrollHeight);
  if (h !== lastH && window.parent !== window){ lastH = h; window.parent.postMessage({hncTool:"o-que-levar", height:h}, "*"); }
}
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

refresh();
})();
