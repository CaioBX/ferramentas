<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicionário Cearês</title>
<meta name="description" content="Dicionário Cearês: as gírias, comidas e frases que você vai ouvir no Ceará, com áudio, significado e exemplo. Uma ferramenta do Hoje no Ceará.">
<meta name="googlebot" content="noindex, indexifembedded">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2433;
    --muted:#567085;
    --paper:#FFFFFF;
    --mist:#F0F5F9;
    --line:#D8E3EB;
    --ocean:#0B4F7A;
    --night:#0E2A44;
    --sea:#1F7FB8;
    --sun:#F2B705;
    --radius-lg:22px;
    --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .tool{max-width:820px;margin:0 auto;padding:20px 16px 18px}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  .top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .top h1{font-family:var(--display);font-weight:700;font-size:clamp(1.65rem,4.6vw,2.35rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-variation-settings:"opsz" 96}
  .lead{margin:0;color:var(--muted);max-width:54ch}
  .seg{display:flex;background:var(--mist);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:0;background:none;padding:6px 10px;border-radius:999px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--paper);color:var(--ocean);box-shadow:0 1px 2px rgba(15,36,51,.12)}

  /* Palavra do dia */
  .hero{margin-top:18px;background:var(--night);color:#fff;border-radius:var(--radius-lg);padding:22px 24px 20px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:22px solid var(--sun);opacity:.9}
  .hero .label{margin:0;font-size:.88rem;color:#BFD6E6;position:relative}
  .hero .word{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,11vw,4.6rem);line-height:.95;letter-spacing:-.035em;margin:8px 0 12px;position:relative;font-variation-settings:"opsz" 96;overflow-wrap:anywhere}
  .hero .word span{background:linear-gradient(transparent 84%, var(--sun) 84%, var(--sun) 93%, transparent 93%)}
  .hero .meaning{font-size:1.12rem;line-height:1.45;margin:0;max-width:52ch;position:relative}
  .hero .ex{margin:12px 0 0;color:#DCEAF4;position:relative;max-width:56ch}
  .hero .ex q{font-style:italic;quotes:"“" "”"}
  .hero .ex .tr{display:block;color:#9FBCD1;font-size:.92rem;margin-top:2px}
  .hero .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative}
  .btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:.92rem;cursor:pointer;text-decoration:none;line-height:1.2}
  .btn svg{width:17px;height:17px;flex:0 0 auto}
  .btn.sun{background:var(--sun);color:var(--ink)}
  .btn.ghost{background:rgba(255,255,255,.1);color:#fff}
  .btn.wa{background:#1FA855;color:#fff}

  /* Busca e filtros */
  .finder{margin-top:22px;display:grid;gap:10px}
  .search{position:relative}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
  .search input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px 12px 42px;font-size:1.02rem;background:var(--paper)}
  .search input:focus{border-color:var(--ocean);outline:none;box-shadow:0 0 0 3px rgba(31,127,184,.18)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chips button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:.92rem;cursor:pointer;line-height:1.25}
  .chips button[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:#fff}
  .count{margin-left:auto;color:var(--muted);font-size:.86rem}

  /* Verbetes */
  .entries{list-style:none;margin:12px 0 0;padding:0;border-top:1.5px solid var(--ink)}
  .entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .entry h3{font-family:var(--display);font-weight:700;font-size:1.32rem;line-height:1.15;margin:0;letter-spacing:-.01em}
  .entry .cat{font-size:.78rem;color:var(--muted);margin-left:8px;font-family:var(--body);font-weight:400;letter-spacing:0}
  .entry .m{grid-column:1 / -1;margin:2px 0 0;max-width:64ch}
  .entry .ex{grid-column:1 / -1;margin:4px 0 0;color:var(--muted);font-size:.95rem;max-width:64ch}
  .entry .ex q{font-style:italic;color:var(--ink);quotes:"“" "”"}
  .entry .ex .tr{display:block;font-size:.88rem}
  .play{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;color:var(--ocean);align-self:start}
  .play svg{width:18px;height:18px}
  .play.on{background:var(--sun);border-color:var(--sun);color:var(--ink)}
  .none{color:var(--muted);padding:16px 2px;margin:0}

  .note{margin-top:16px;background:var(--mist);border-radius:var(--radius-lg);padding:14px 18px;font-size:.92rem;color:var(--muted)}
  .note p{margin:0}
  footer{margin-top:16px;color:var(--muted);font-size:.8rem;line-height:1.5}
  footer p{margin:0 0 4px}
  footer .brand{color:var(--ink);font-weight:700}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:.9rem;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<main class="tool">
  <header class="top">
    <div>
      <h1 id="t-title"></h1>
      <p class="lead" id="t-lead"></p>
    </div>
    <div class="seg" role="group" id="langs"></div>
  </header>

  <section class="hero" id="hero" aria-live="polite"></section>

  <div class="finder">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" autocomplete="off">
    </div>
    <div class="chips" role="group" id="cats"></div>
  </div>

  <ul class="entries" id="entries" aria-live="polite"></ul>

  <div class="note"><p id="note"></p></div>
  <footer id="foot"></footer>
</main>
<div class="toast" id="toast" role="status"></div>

/* ================= Estado ================= */
var params = new URLSearchParams(location.search);
var SLANG = WORDS.filter(function(w){ return w.cat === "giria"; });
var dayIndex = Math.floor((Date.now() - 3 * 3600e3) / 864e5);
var state = {
  lang: detectLang(),
  hero: (WORDS.filter(function(w){ return w.id === params.get("palavra"); })[0] || SLANG[dayIndex % SLANG.length]).id,
  heroIsDaily: !params.get("palavra"),
  cat: "all",
  q: ""
};
function detectLang(){
  var q = (params.get("lang") || "").toLowerCase();
  if (LANGS.indexOf(q) >= 0) return q;
  var host = "", path = "";
  try { if (location.ancestorOrigins && location.ancestorOrigins.length) host = new URL(location.ancestorOrigins[0]).hostname; } catch(e){}
  try { if (document.referrer){ var u = new URL(document.referrer); host = host || u.hostname; path = u.pathname; } } catch(e){}
  var m = host.match(/^(en|es|fr|it)\./) || path.match(/^\/(en|es|fr|it)(\/|$)/);
  if (m) return m[1];
  if (/hojenoceara\.com\.br$/.test(host)) return "pt";
  var nav = (navigator.language || "pt").slice(0, 2).toLowerCase();
  return LANGS.indexOf(nav) >= 0 ? nav : "pt";
}
function tr(){ return T[state.lang]; }
function fill(s, o){ return s.replace(/\{(\w+)\}/g, function(_, k){ return o[k] != null ? o[k] : ""; }); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function byId(id){ return WORDS.filter(function(w){ return w.id === id; })[0]; }
var $ = function(id){ return document.getElementById(id); };

/* ================= Áudio (voz do próprio navegador) ================= */
var synth = window.speechSynthesis, voice = null;
function pickVoice(){
  if (!synth) return;
  var vs = synth.getVoices();
  voice = vs.filter(function(v){ return /^pt[-_]BR/i.test(v.lang); })[0] || vs.filter(function(v){ return /^pt/i.test(v.lang); })[0] || null;
}
if (synth){ pickVoice(); if (synth.addEventListener) synth.addEventListener("voiceschanged", pickVoice); else synth.onvoiceschanged = pickVoice; }
var playingBtn = null;
function speak(text, btn){
  if (!synth || typeof SpeechSynthesisUtterance === "undefined"){ toast(tr().noAudio); return; }
  synth.cancel();
  if (playingBtn) playingBtn.classList.remove("on");
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "pt-BR"; u.rate = 0.88;
  if (voice) u.voice = voice;
  if (btn){ btn.classList.add("on"); playingBtn = btn; }
  u.onend = u.onerror = function(){ if (btn) btn.classList.remove("on"); if (playingBtn === btn) playingBtn = null; };
  synth.speak(u);
}
var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

var ICON_WA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>';
var ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

/* ================= Interface ================= */
function renderStatic(){
  var t = tr();
  document.documentElement.lang = LOCALE[state.lang];
  document.title = t.title;
  $("t-title").textContent = t.title;
  $("t-lead").textContent = t.lead;
  $("langs").setAttribute("aria-label", t.langGroup);
  $("langs").innerHTML = LANGS.map(function(l){
    return '<button type="button" data-lang="' + l + '" aria-pressed="' + (l === state.lang) + '" lang="' + LOCALE[l] + '">' + l.toUpperCase() + '</button>';
  }).join("");
  $("q").placeholder = t.search;
  $("q").setAttribute("aria-label", t.search);
  $("cats").setAttribute("aria-label", t.search);
  $("note").textContent = t.note;
  $("foot").innerHTML = '<p>' + t.madeBy + '</p>';
}

function exampleHTML(w){
  if (!w.ex) return "";
  var trn = state.lang !== "pt" && w.ext ? '<span class="tr" lang="' + LOCALE[state.lang] + '">' + esc(w.ext[state.lang]) + '</span>' : "";
  return '<q lang="pt-BR">' + esc(w.ex) + '</q>' + trn;
}

function renderHero(){
  var t = tr(), w = byId(state.hero);
  $("hero").innerHTML =
    '<p class="label">' + esc(state.heroIsDaily ? t.wordOfDay : t.picked) + '</p>' +
    '<p class="word" lang="pt-BR"><span>' + esc(w.w) + '</span></p>' +
    '<p class="meaning">' + esc(w.m[state.lang]) + '</p>' +
    (w.ex ? '<p class="ex">' + exampleHTML(w) + '</p>' : '') +
    '<div class="acts">' +
      '<button type="button" class="btn sun" data-say="word">' + ICON_PLAY + esc(t.listen) + '</button>' +
      (w.ex ? '<button type="button" class="btn ghost" data-say="ex">' + ICON_PLAY + esc(t.listenEx) + '</button>' : '') +
      '<button type="button" class="btn ghost" data-act="another">' + ICON_SHUFFLE + esc(t.another) + '</button>' +
      '<a class="btn wa" href="' + esc(waLink(w)) + '" target="_blank" rel="noopener">' + ICON_WA + esc(t.wa) + '</a>' +
      '<button type="button" class="btn ghost" data-act="copy">' + ICON_COPY + esc(t.copy) + '</button>' +
    '</div>';
}

function shareText(w){
  return fill(tr().share, {w: w.w, m: w.m[state.lang], url: shareURL()});
}
function shareURL(){
  var u = CONFIG.shareURL;
  if (state.lang !== "pt"){ try { var x = new URL(u); x.hostname = state.lang + ".hojenoceara.com.br"; u = x.toString(); } catch(e){} }
  return u;
}
function waLink(w){ return "https://wa.me/?text=" + encodeURIComponent(shareText(w)); }

function filtered(){
  var q = norm(state.q.trim());
  return WORDS.filter(function(w){
    if (state.cat !== "all" && w.cat !== state.cat) return false;
    if (!q) return true;
    return norm(w.w).indexOf(q) >= 0 || norm(w.m[state.lang]).indexOf(q) >= 0 || norm(w.m.pt).indexOf(q) >= 0 || (w.ex && norm(w.ex).indexOf(q) >= 0);
  });
}

function renderList(){
  var t = tr(), list = filtered();
  $("cats").innerHTML = CATS.map(function(c){
    return '<button type="button" data-cat="' + c + '" aria-pressed="' + (c === state.cat) + '">' + esc(t.cats[c]) + '</button>';
  }).join("") + '<span class="count">' + esc(list.length === 1 ? t.count1 : fill(t.count, {n: list.length})) + '</span>';
  if (!list.length){
    $("entries").innerHTML = '<li class="none">' + esc(fill(t.none, {q: state.q.trim()})) + '</li>';
    return;
  }
  $("entries").innerHTML = list.map(function(w){
    return '<li class="entry">' +
      '<h3 lang="pt-BR">' + esc(w.w) + '<span class="cat">' + esc(t.catShort[w.cat]) + '</span></h3>' +
      '<button type="button" class="play" data-id="' + w.id + '" aria-label="' + esc(t.listen + ": " + w.w) + '">' + ICON_PLAY + '</button>' +
      '<p class="m">' + esc(w.m[state.lang]) + '</p>' +
      (w.ex ? '<p class="ex">' + exampleHTML(w) + '</p>' : '') +
      '</li>';
  }).join("");
}

function renderAll(){ renderStatic(); renderHero(); renderList(); postHeight(); }

/* ================= Ações ================= */
var toastTimer = null;
function toast(msg){
  var el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
}
function copyText(text){
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(tr().copied); } catch(e){}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(tr().copied); }, fallback);
  } else fallback();
}

$("hero").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  var w = byId(state.hero);
  if (b.getAttribute("data-say") === "word") speak(w.say || w.w, b);
  else if (b.getAttribute("data-say") === "ex") speak(w.ex, b);
  else if (b.getAttribute("data-act") === "another"){
    var pool = SLANG.filter(function(x){ return x.id !== state.hero; });
    state.hero = pool[Math.floor(Math.random() * pool.length)].id; state.heroIsDaily = false;
    renderHero(); postHeight();
  }
  else if (b.getAttribute("data-act") === "copy") copyText(shareText(w));
});
$("entries").addEventListener("click", function(e){
  var b = e.target.closest(".play"); if (!b) return;
  var w = byId(b.getAttribute("data-id"));
  speak(w.say || w.w, b);
});
$("cats").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  state.cat = b.getAttribute("data-cat"); renderList(); postHeight();
});
$("q").addEventListener("input", function(e){ state.q = e.target.value; renderList(); postHeight(); });
$("langs").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  state.lang = b.getAttribute("data-lang"); renderAll();
});

var lastH = 0;
function postHeight(){
  var h = Math.ceil(document.documentElement.scrollHeight);
  if (h !== lastH && window.parent !== window){ lastH = h; window.parent.postMessage({hncTool:"dicionario-cearense", height:h}, "*"); }
}
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

renderAll();
})();
